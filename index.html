<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>EPL — Eid Premier League</title>
<meta name="description" content="Live cricket tournament hub — teams, auction, live scoring, points table and stats.">
<!-- Force browsers/CDNs to always fetch the latest version of this page instead of
     serving a stale cached copy to visitors (GitHub Pages / Netlify don't let this
     single HTML file set real HTTP cache headers, so this is done via meta tags). -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="app-build" content="2026-09-17-01">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   EPL TOURNAMENT APP — DESIGN TOKENS
   Minimal, premium cricket-championship identity: deep emerald +
   soft green on white/off-white, gold reserved for championship
   moments, red reserved for danger/wicket actions only.
   ============================================================ */
:root{
  --pitch-900:#0a2416;
  --pitch-800:#0f3320;
  --pitch-700:#15462b;
  --pitch-600:#1c5c37;
  --pitch-500:#227a46;
  --navy-950:#050c14;
  --navy-900:#0a1626;
  --navy-800:#101f36;
  --cream:#fafaf8;
  --cream-dim:#f0f2ef;
  --ink:#171e1a;
  --ink-soft:#63706b;
  --gold:#c79a3d;
  --gold-dark:#a17c2c;
  --gold-light:#dab765;
  --white:#ffffff;
  --red:#c0392b;
  --red-soft:#f7e3e0;
  --blue:#1c7a92;
  --line:#e4e6e2;
  --line-dark:#23412d;
  --shadow:0 2px 10px rgba(15,30,20,0.06);
  --shadow-lg:0 10px 30px rgba(15,30,20,0.10);
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:14px;
  --font-display:'Space Grotesk',sans-serif;
  --font-score:'Bebas Neue',var(--font-display),sans-serif;
  --font-body:'Inter',sans-serif;
  --header-h:60px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-body);
  background:var(--cream);
  background-image:
    radial-gradient(circle at 6% 0%, rgba(199,154,61,0.035), transparent 40%),
    radial-gradient(circle at 100% 12%, rgba(21,70,43,0.03), transparent 45%);
  background-attachment:fixed;
  color:var(--ink);
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:64px;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:15px;}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;letter-spacing:-0.01em;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
:focus-visible{outline:2.5px solid var(--gold-dark);outline-offset:2px;}

/* Layout shell */
.app-header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(120deg,var(--navy-950) 0%,var(--pitch-900) 55%,var(--pitch-800) 100%);
  color:var(--cream);
  height:var(--header-h);
  display:flex;align-items:center;
  padding:0 14px;
  box-shadow:0 2px 0 var(--gold), 0 6px 16px rgba(0,0,0,0.28);
  border-bottom:1px solid rgba(224,169,41,0.35);
}
.app-header .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.app-header .brand img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--gold-light);flex-shrink:0;border:1.5px solid rgba(224,169,41,0.6);box-shadow:0 0 0 3px rgba(224,169,41,0.12);}
.app-header .brand-text{display:flex;flex-direction:column;min-width:0;}
.app-header .brand-text b{font-family:var(--font-display);font-size:15px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,#fff,var(--gold-light));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.app-header .brand-text span{font-size:10px;color:var(--gold-light);letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.85;}
.header-actions{display:flex;align-items:center;gap:6px;}
.icon-btn{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--cream);background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  font-size:16px;flex-shrink:0;transition:background .15s;
}
.icon-btn:active{background:rgba(224,169,41,0.25);}

main{max-width:1180px;margin:0 auto;padding:14px;min-height:60vh;}

/* Bottom nav (mobile) */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:linear-gradient(180deg,#fffdf7,var(--white));
  border-top:1px solid var(--line);
  display:flex;
  box-shadow:0 -6px 20px rgba(5,15,10,0.10);
  padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav button{
  position:relative;
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 7px;color:var(--ink-soft);font-size:10px;font-weight:700;
  transition:color .15s;
}
.bottom-nav button .bn-ic{font-size:18px;transition:transform .18s;}
.bottom-nav button.active{color:var(--pitch-700);}
.bottom-nav button.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:0 0 4px 4px;background:var(--gold);}
.bottom-nav button.active .bn-ic{transform:translateY(-1px) scale(1.08);}

/* Drawer menu (more sections) */
.drawer-overlay{position:fixed;inset:0;background:rgba(5,12,20,.6);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:82%;max-width:320px;
  background:var(--cream);z-index:71;
  transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.drawer.open{transform:translateX(0);}
.drawer-head{background:linear-gradient(120deg,var(--navy-950),var(--pitch-900));color:var(--cream);padding:18px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(224,169,41,.35);}
.drawer-body{padding:8px;overflow-y:auto;flex:1;}
.drawer-body a,.drawer-body button{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:12px 12px;border-radius:var(--radius-m);font-weight:600;font-size:14.5px;color:var(--ink);
}
.drawer-body a:active,.drawer-body button:active{background:var(--cream-dim);}
.drawer-foot{padding:12px;border-top:1px solid var(--line);}

/* Buttons — 5-role system: Primary / Secondary / Championship / Danger / Disabled */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:var(--radius-m);font-weight:700;font-size:14px;
  transition:transform .15s ease, box-shadow .18s ease, filter .18s ease, background .18s ease, border-color .18s ease;
  white-space:nowrap; border:1.5px solid transparent; cursor:pointer;
}
.btn:active{transform:scale(0.97);}
/* Primary — subtle emerald gradient */
.btn-primary{background:linear-gradient(160deg,var(--pitch-600),var(--pitch-700));color:var(--white);box-shadow:0 2px 8px rgba(15,51,32,0.22);}
.btn-primary:hover{filter:brightness(1.06);box-shadow:0 3px 12px rgba(15,51,32,0.28);}
/* Championship — soft gold, for standout/celebratory actions (Finish Match etc.) */
.btn-gold{background:linear-gradient(160deg,var(--gold-light),var(--gold));color:var(--navy-950);box-shadow:0 2px 8px rgba(161,124,44,0.22);}
.btn-gold:hover{filter:brightness(1.04);box-shadow:0 3px 12px rgba(161,124,44,0.28);}
/* Secondary — soft-gray/white fill with green text */
.btn-outline{background:var(--cream-dim);border:1.5px solid var(--line);color:var(--pitch-700);}
.btn-outline:hover{background:#e7ebe6;border-color:var(--pitch-500);}
.btn-outline-light{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.3);color:var(--cream);}
.btn-outline-light:hover{background:rgba(255,255,255,.14);}
/* Danger — reserved for Wicket / destructive actions only */
.btn-danger{background:linear-gradient(160deg,#cf4a3c,var(--red));color:var(--white);box-shadow:0 2px 8px rgba(192,57,43,0.22);}
.btn-danger:hover{filter:brightness(1.05);box-shadow:0 3px 12px rgba(192,57,43,0.28);}
/* Ghost — quiet tertiary action, neutral */
.btn-ghost{background:var(--cream-dim);color:var(--ink);border-color:transparent;}
.btn-ghost:hover{background:#e7ebe6;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:var(--radius-s);}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;pointer-events:none;filter:grayscale(.3);}
.btn-icon{width:38px;height:38px;padding:0;border-radius:50%;}
@media(hover:none){ .btn:hover{filter:none;box-shadow:inherit;background:inherit;} }

/* Cards — used sparingly; thin border + very soft shadow, not heavy boxes */
.card{background:var(--white);border-radius:var(--radius-l);box-shadow:var(--shadow);padding:16px;border:1px solid var(--line);}
.card-tight{padding:12px;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px;padding-left:10px;border-left:3px solid var(--pitch-600);}
.section-title h2{font-size:17px;color:var(--pitch-900);font-weight:700;letter-spacing:-.01em;}
.section-title .link-more{font-size:12.5px;font-weight:700;color:var(--pitch-700);}
.section-title h2 .tag-count{font-size:11px;background:var(--cream-dim);color:var(--ink-soft);padding:2px 8px;border-radius:20px;margin-left:8px;font-family:var(--font-body);}

.grid{display:grid;gap:12px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(min-width:640px){.grid-3{grid-template-columns:repeat(3,1fr);} .grid-4{grid-template-columns:repeat(4,1fr);}}
@media(max-width:639px){.grid-4{grid-template-columns:repeat(2,1fr);}}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em;}
.pill-live{background:var(--red);color:#fff;box-shadow:0 0 0 3px rgba(200,53,42,0.16);}
.pill-live::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.pill-upcoming{background:#e2eef1;color:var(--blue);}
.pill-completed{background:var(--cream-dim);color:var(--ink-soft);}
.pill-postponed{background:#f7e6d0;color:#8a5a12;}
.pill-cancelled{background:var(--red-soft);color:var(--red);}
.pill-demo{background:var(--gold-light);color:#7a5a0c;}
.pill-sold{background:#dcf3e4;color:#186a3a;}
.pill-unsold{background:var(--red-soft);color:var(--red);}

.empty-state{text-align:center;padding:40px 16px;color:var(--ink-soft);}
.empty-state .es-icon{font-size:38px;margin-bottom:8px;}
.empty-state h3{font-size:15px;color:var(--ink);margin-bottom:4px;}
.empty-state p{font-size:13px;max-width:320px;margin:0 auto;}

.skeleton{background:linear-gradient(90deg,var(--cream-dim) 25%,#f7f4ea 37%,var(--cream-dim) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px;}
@keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

.toast-wrap{position:fixed;top:calc(var(--header-h) + 8px);left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px;}
.toast{
  pointer-events:auto;max-width:420px;width:100%;padding:12px 14px;border-radius:var(--radius-m);
  font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);
  animation:toastin .25s ease;
}
@keyframes toastin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.toast-success{background:linear-gradient(120deg,var(--pitch-600),var(--pitch-800));color:#fff;}
.toast-error{background:linear-gradient(120deg,#d64536,var(--red));color:#fff;}
.toast-info{background:linear-gradient(120deg,var(--navy-900),var(--pitch-900));color:#fff;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(5,12,20,.62);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;}
.modal-overlay.open{opacity:1;pointer-events:auto;}
@media(min-width:720px){.modal-overlay{align-items:center;}}
.modal{
  background:var(--cream);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(30px);transition:transform .22s ease;
  border-top:3px solid var(--gold);
}
@media(min-width:720px){.modal{border-radius:18px;border-top:3px solid var(--gold);transform:translateY(0) scale(.96);}}
.modal-overlay.open .modal{transform:translateY(0) scale(1);}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-head h3{font-size:17px;color:var(--pitch-900);}

.field{margin-bottom:13px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=number],
.field input[type=date],.field input[type=time],.field input[type=url],.field select,.field textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--radius-m);
  background:var(--white);font-size:14.5px;color:var(--ink);transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pitch-600);}
.field textarea{resize:vertical;min-height:70px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.field-hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.field-err{font-size:12px;color:var(--red);margin-top:4px;font-weight:600;}
.pw-wrap{position:relative;}
.pw-wrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--pitch-700);padding:6px;}

.img-upload{
  border:2px dashed var(--line);border-radius:var(--radius-m);padding:14px;text-align:center;
  background:var(--white);position:relative;
}
.img-upload img{max-height:120px;margin:0 auto 8px;border-radius:8px;object-fit:cover;}
.img-upload .iu-progress{height:5px;background:var(--cream-dim);border-radius:3px;overflow:hidden;margin-top:8px;}
.img-upload .iu-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-light),var(--gold));width:0%;transition:width .2s;}
.img-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:linear-gradient(120deg,var(--navy-950),var(--pitch-900));color:var(--cream);text-align:left;padding:9px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;border-bottom:2px solid var(--gold);}
th:first-child{border-radius:8px 0 0 0;}th:last-child{border-radius:0 8px 0 0;}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:nth-child(even) td{background:rgba(18,58,36,.025);}
tr:nth-child(-n+3) td:first-child{font-weight:800;color:var(--gold-dark);}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:var(--shadow);}

.spinner{width:20px;height:20px;border:2.5px solid rgba(0,0,0,.12);border-top-color:var(--pitch-700);border-radius:50%;animation:spin .7s linear infinite;}
.spinner-light{border-color:rgba(255,255,255,.3);border-top-color:#fff;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-block{display:flex;align-items:center;justify-content:center;padding:40px;gap:10px;color:var(--ink-soft);font-size:13px;font-weight:600;}

.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch;}
.tabs button{padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:700;color:var(--ink-soft);background:var(--cream-dim);white-space:nowrap;flex-shrink:0;transition:background .15s,color .15s;}
.tabs button.active{background:linear-gradient(120deg,var(--pitch-700),var(--pitch-900));color:#fff;box-shadow:0 2px 8px rgba(18,58,36,.3);}

.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--cream-dim);flex-shrink:0;border:2px solid var(--white);box-shadow:0 0 0 1px var(--line);}
.avatar-lg{width:64px;height:64px;}
.avatar-sm{width:28px;height:28px;border-width:1.5px;}

/* Login screen */
.login-wrap{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{max-width:380px;width:100%;}
.login-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--navy-950),var(--pitch-900));color:var(--gold-light);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;border:1px solid rgba(224,169,41,.4);}

/* Admin */
.admin-shell{display:flex;min-height:calc(100vh - var(--header-h) - 64px);gap:16px;}
.admin-side{width:210px;flex-shrink:0;display:none;}
@media(min-width:900px){.admin-side{display:block;} .admin-main{flex:1;min-width:0;}}
.admin-side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-m);font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:2px;border-left:3px solid transparent;transition:background .15s,color .15s;}
.admin-side a:hover{background:var(--cream-dim);}
.admin-side a.active{background:rgba(28,92,55,0.08);color:var(--pitch-700);border-left:3px solid var(--pitch-600);font-weight:700;}
.admin-topbar{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
@media(min-width:900px){.admin-topbar{display:none;}}
.stat-box{background:var(--white);border-radius:var(--radius-l);padding:14px;box-shadow:var(--shadow);border-top:3px solid var(--gold);}
.stat-box b{font-family:var(--font-score);font-size:28px;letter-spacing:.02em;color:var(--pitch-900);display:block;}
.stat-box span{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
.admin-item-row{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line);}
.admin-item-row:last-child{border-bottom:none;}
.admin-item-row .aif-main{flex:1;min-width:0;}
.admin-item-row .aif-main b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.admin-item-row .aif-main span{font-size:11.5px;color:var(--ink-soft);}
.admin-item-row .aif-actions{display:flex;gap:4px;}

.hero{
  background:linear-gradient(135deg,var(--navy-950) 0%,var(--pitch-800) 55%,var(--pitch-600) 100%);
  border-radius:var(--radius-l);color:var(--cream);padding:24px 18px;position:relative;overflow:hidden;
  background-size:cover;background-position:center;
  border:1px solid rgba(224,169,41,.25);
}
.hero::before{
  content:'';position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(circle at 85% 15%, rgba(224,169,41,0.20) 0%, transparent 32%),
    repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 14px);
}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(5,12,20,.88),rgba(18,58,36,.68));}
.hero>*{position:relative;z-index:1;}
.hero-logo{width:52px;height:52px;border-radius:14px;background:#fff2;object-fit:cover;margin-bottom:10px;border:1.5px solid rgba(224,169,41,.5);}
.hero h1{font-size:25px;margin-bottom:4px;letter-spacing:-.01em;}
.hero p{font-size:13px;color:var(--gold-light);font-weight:600;}
.hero-stats{display:flex;gap:16px;margin-top:18px;flex-wrap:wrap;}
.hero-stats div{border-left:2px solid rgba(224,169,41,.5);padding-left:10px;}
.hero-stats div b{display:block;font-family:var(--font-score);font-size:24px;letter-spacing:.02em;}
.hero-stats div span{font-size:10px;color:var(--gold-light);text-transform:uppercase;letter-spacing:.06em;}

.match-card{border-radius:var(--radius-l);overflow:hidden;box-shadow:var(--shadow);background:var(--white);border:1px solid rgba(18,58,36,0.06);}
.match-card .mc-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:linear-gradient(120deg,var(--cream-dim),#f2ead2);}
.mc-body{padding:14px;}
.mc-team-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.mc-team{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}

  el.style.display = 'block';

window.addEventListener('error', (e)=>{
  // Ignore generic cross-origin "Script error." with no detail — these come from
  // third-party scripts (ad/embed widgets, browser extensions, flaky CDN loads) and
  // carry no useful diagnostic info; showing them as app errors only confuses users.
  const isOpaque = (e.message==='Script error.' || e.message==='Script error') && !e.error && !e.filename;
  if(isOpaque){ console.warn('Ignored opaque cross-origin script error (not from app code).'); return; }
  showErrorBanner((e.error&&e.error.stack) || e.message || 'Unknown error');
});
window.addEventListener('unhandledrejection', (e)=>{ showErrorBanner('Promise error: ' + ((e.reason&&e.reason.message) || e.reason)); });

// Whether THIS browser has ever explicitly picked a season. If not, we follow

// Appends a cache-busting query param derived from the record's updatedAt
// timestamp, so that re-uploading a logo/banner/photo to the same URL (e.g.

// of silently continuing to show an old cached copy.
function cacheBust(url, ts){
  if(!url) return url;
  const v = ts || Date.now();
  return url + (url.includes('?') ? '&' : '?') + '_v=' + v;
}
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function timeAgo(ts){
  if(!ts) return '';
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h = Math.floor(m/60);
  if(h<24) return h+'h ago';
  const d = Math.floor(h/24);
  return d+'d ago';
}

/* Cloudinary upload — returns secure_url via callback(progress) then promise */
function uploadToCloudinary(file, onProgress){
  return new Promise((resolve,reject)=>{
    if(!file) return reject(new Error('No file selected'));
    if(!file.type.startsWith('image/')) return reject(new Error('Only image files are allowed'));
    if(file.size > 8*1024*1024) return reject(new Error('Image must be under 8MB'));
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUDINARY_PRESET);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', CLOUDINARY_URL);
    xhr.upload.onprogress = (e)=>{
      if(e.lengthComputable && onProgress) onProgress(Math.round((e.loaded/e.total)*100));
    };
    xhr.onload = ()=>{
      try{
        const res = JSON.parse(xhr.responseText);
        if(xhr.status>=200 && xhr.status<300 && res.secure_url){
          resolve(res.secure_url);
        }else{
          reject(new Error(res.error?.message || 'Upload failed'));
        }
      }catch(e){ reject(new Error('Upload failed — invalid response')); }
    };
    xhr.onerror = ()=> reject(new Error('Network error during upload'));
    xhr.send(fd);
  });
}
/* Wires an .img-upload block: expects input[type=file] + img preview + progress bar.
   fieldId = the container id. Sets window._pendingUploads[fieldId] = url after upload. */
window._pendingUploads = {};
function wireImageUpload(containerId, currentUrl){
  window._pendingUploads[containerId] = currentUrl || '';
  const el = document.getElementById(containerId);
  if(!el) return;
  const input = el.querySelector('input[type=file]');
  const img = el.querySelector('img');
  const prog = el.querySelector('.iu-progress i');
  const label = el.querySelector('.iu-label');
  input.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const localUrl = URL.createObjectURL(file);
    img.src = localUrl; img.style.display='block';
    if(prog){ prog.parentElement.style.display='block'; prog.style.width='0%'; }
    if(label) label.textContent = 'Uploading…';
    try{
      const url = await uploadToCloudinary(file, (p)=>{ if(prog) prog.style.width=p+'%'; });
      window._pendingUploads[containerId] = url;
      if(label) label.textContent = 'Uploaded ✓ (tap to change)';
      toast('Image uploaded','success');
    }catch(err){
      toast(err.message,'error');
      if(label) label.textContent = 'Upload failed — tap to retry';
    }
  });
  // "Or paste an image link" fallback — appended once, right after the upload box
  if(!el.dataset.linkRowAdded){
    el.dataset.linkRowAdded = '1';
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:6px;margin-top:8px;';
    row.innerHTML = `<input type="text" placeholder="Or paste an image URL (https://…)" style="flex:1;padding:9px 10px;border:1.5px solid var(--line);border-radius:var(--radius-m);font-size:13px;background:var(--white);">
      <button type="button" class="btn btn-sm btn-outline">Use Link</button>`;
    el.insertAdjacentElement('afterend', row);
    const linkInput = row.querySelector('input');
    const linkBtn = row.querySelector('button');
    linkBtn.onclick = ()=>{
      const url = linkInput.value.trim();
      if(!url || !/^https?:\/\//i.test(url)){ toast('Enter a valid image URL starting with http:// or https://','error'); return; }
      window._pendingUploads[containerId] = url;
      img.src = url; img.style.display='block';
      if(label) label.textContent = 'Using linked image ✓';
      toast('Image link set','success');
    };
  }
}

function doGoogleLogin(btn){
  btn.disabled = true;
  const original = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span>';
  auth.signInWithPopup(googleProvider)
    .then(()=>{ toast('Signed in with Google','success'); location.hash='#/admin'; })
    .catch(err=>{
      if(err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request' || err.code === 'auth/operation-not-supported-in-this-environment'){
        // Mobile browsers often block popups — fall back to a full-page redirect
        auth.signInWithRedirect(googleProvider);
        return;
      }
      if(err.code === 'auth/popup-closed-by-user'){
        btn.disabled=false; btn.innerHTML=original; return;
      }
      toast('Google sign-in failed: ' + (err.message||err.code), 'error');
      btn.disabled=false; btn.innerHTML=original;
    });
}

   REALTIME LISTENERS (season-aware)
   ============================================================ */
function seasonPath(kind){
  // 'settings' or 'auction' — the 'default' season keeps the original flat paths
  // (so existing data before multi-season support keeps working with zero migration);
  // any other season gets its own namespaced copy.
  if(CURRENT_SEASON_ID==='default') return kind;
  return 'tournamentSeasons/'+CURRENT_SEASON_ID+'/'+kind;
}
function bindRawListener(path, stateKey, loadedKey){
  db.ref(path).on('value', snap=>{
    S_RAW[stateKey] = snap.val() || {};
    S.loaded[loadedKey] = true;
    applySeasonFilter();
  }, err=>{ console.error('listener error', path, err); S.loaded[loadedKey]=true; });
}
function applySeasonFilter(){
  SEASON_SCOPED_COLLECTIONS.forEach(key=>{
    const raw = S_RAW[key]||{};
    const filtered = {};
    Object.keys(raw).forEach(k=>{
      const rec = raw[k];
      const sid = (rec && rec.seasonId) || 'default';
      if(sid === CURRENT_SEASON_ID) filtered[k] = rec;
    });
    S[key] = filtered;
  });
  render();
}
let _settingsRef=null, _auctionRef=null;
function bindSeasonSingletons(){
  if(_settingsRef) _settingsRef.off();
  if(_auctionRef) _auctionRef.off();
  S.loaded.settings = false;
  _settingsRef = db.ref(seasonPath('settings'));
  _settingsRef.on('value', snap=>{
    S.settings = snap.val() || {};
    S.loaded.settings = true;
    render();
  }, err=>{ console.error('settings listener error', err); S.loaded.settings=true; });
  _auctionRef = db.ref(seasonPath('auction'));
  _auctionRef.on('value', snap=>{
    S.auction = snap.val() || {};
    render();
  }, err=>console.error('auction listener error', err));
}
function switchSeason(seasonId){
  CURRENT_SEASON_ID = seasonId;
  USER_HAS_CHOSEN_SEASON = true;
  try{ localStorage.setItem('epl_current_season', seasonId); }catch(e){}
  applySeasonFilter();
  bindSeasonSingletons();
  if(location.hash.startsWith('#/team/')||location.hash.startsWith('#/player/')||location.hash.startsWith('#/match/')) go('home');
}
function setActiveSeasonForNewVisitors(seasonId){
  return db.ref('activeSeasonId').set(seasonId);
}
function deleteSeason(seasonId){
  if(seasonId==='default') return Promise.reject(new Error('The default season can\'t be deleted.'));
  const updates = {};
  updates['tournamentSeasonsList/'+seasonId] = null;
  updates['tournamentSeasons/'+seasonId] = null;
  return db.ref().update(updates).then(()=>{
    if(CURRENT_SEASON_ID===seasonId){ USER_HAS_CHOSEN_SEASON=false; try{ localStorage.removeItem('epl_current_season'); }catch(e){} switchSeason('default'); }
  });
}
function initListeners(){
  bindSeasonSingletons();
  bindRawListener('teams','teams','teams');
  bindRawListener('players','players','players');
  bindRawListener('matches','matches','matches');
  bindRawListener('notices','notices','notices');
  bindRawListener('sponsors','sponsors','sponsors');
  bindRawListener('gallery','gallery','gallery');
  bindRawListener('rules','rules','rules');
  db.ref('admins').on('value', snap=>{ S.admins = snap.val()||{}; });
  db.ref('tournamentSeasonsList').on('value', snap=>{ SEASONS_LIST = snap.val()||{}; render(); });
  db.ref('activeSeasonId').on('value', snap=>{
    ACTIVE_SEASON_ID = snap.val() || 'default';
    // A visitor who has never manually picked a season follows whatever the
    // admin has marked active — so a brand-new visitor lands on the season
    // currently running, not always on the literal 'default' one.
    if(!USER_HAS_CHOSEN_SEASON && ACTIVE_SEASON_ID !== CURRENT_SEASON_ID){
      CURRENT_SEASON_ID = ACTIVE_SEASON_ID;
      applySeasonFilter();
      bindSeasonSingletons();
    }
  });
}

/* ============================================================
   CRICKET LOGIC — POINTS TABLE / NRR / PLAYER STATS
   ============================================================ */
function oversPerInningsSetting(){ return Number(S.settings.oversPerInnings) || 20; }

function computePointsTable(){
  const teams = objToArr(S.teams);
  const table = {};
  teams.forEach(t=> table[t.id] = {
    teamId:t.id, name:t.name, shortName:t.shortName||t.name, logo:t.logo||'',
    played:0, won:0, lost:0, tie:0, noResult:0, points:0,
    runsFor:0, oversFor:0, runsAgainst:0, oversAgainst:0, nrr:0
  });
  const matches = objToArr(S.matches).filter(m=>m.status==='completed');
  matches.forEach(m=>{
    const t1 = table[m.team1Id], t2 = table[m.team2Id];
    if(!t1 || !t2) return;
    const inn1 = m.innings1 || {}; const inn2 = m.innings2 || {};
    const allotted = Number(m.oversPerInnings)||oversPerInningsSetting();
    // figure which innings belongs to which team
    [ [inn1, m.team1Id===inn1.battingTeamId? t1:t2, m.team1Id===inn1.bowlingTeamId? t1:t2],
      [inn2, m.team1Id===inn2.battingTeamId? t1:t2, m.team1Id===inn2.bowlingTeamId? t1:t2]
    ].forEach(([inn, battingRow, bowlingRow])=>{
      if(!inn || !inn.battingTeamId) return;
      const balls = inn.balls||0;
      const wickets = inn.wickets||0;
      const oversFaced = wickets>=10 ? allotted : balls/6;
      const oversBowled = wickets>=10 ? allotted : balls/6;
      if(battingRow){ battingRow.runsFor += (inn.runs||0); battingRow.oversFor += oversFaced; }
      if(bowlingRow){ bowlingRow.runsAgainst += (inn.runs||0); bowlingRow.oversAgainst += oversBowled; }
    });
    if(m.result==='tie'){
      t1.played++; t2.played++; t1.tie++; t2.tie++; t1.points+=1; t2.points+=1;
    } else if(m.result==='no-result'){
      t1.played++; t2.played++; t1.noResult++; t2.noResult++; t1.points+=1; t2.points+=1;
    } else if(m.winnerId){
      t1.played++; t2.played++;
      if(m.winnerId===m.team1Id){ t1.won++; t1.points+=2; t2.lost++; } else { t2.won++; t2.points+=2; t1.lost++; }
    }
  });
  Object.values(table).forEach(row=>{
    const rrFor = row.oversFor>0 ? row.runsFor/row.oversFor : 0;
    const rrAgainst = row.oversAgainst>0 ? row.runsAgainst/row.oversAgainst : 0;
    row.nrr = rrFor - rrAgainst;
  });
  return Object.values(table).sort((a,b)=> b.points-a.points || b.nrr-a.nrr || b.won-a.won);
}

function computePlayerStats(){
  const stats = {};
  const players = objToArr(S.players);
  players.forEach(p=> stats[p.id] = {
    playerId:p.id, name:p.name, teamId:p.teamId, photo:p.photo||'', role:p.role||'',
    matches:new Set(), innings:0, runs:0, balls:0, highScore:0, fours:0, sixes:0, outs:0, notOuts:0, ducks:0, fifties:0, hundreds:0,
    bMatches:new Set(), oversBalls:0, runsConceded:0, wickets:0, dotBallsBowled:0, bestBowling:'', threeWktHauls:0, fiveWktHauls:0,
    catches:0, runOuts:0, stumpings:0, pom:0
  });
  const matches = objToArr(S.matches).filter(m=>m.status==='completed');
  matches.forEach(m=>{
    [m.innings1, m.innings2].forEach(inn=>{
      if(!inn) return;
      const bc = inn.battingCard || {};
      Object.keys(bc).forEach(pid=>{
        if(!stats[pid]) return;
        const row = bc[pid];
        stats[pid].matches.add(m.id);
        const played = (row.balls>0 || row.out);
        stats[pid].innings += played ? 1 : 0;
        stats[pid].runs += row.runs||0;
        stats[pid].balls += row.balls||0;
        stats[pid].fours += row.fours||0;
        stats[pid].sixes += row.sixes||0;
        if(row.out){ stats[pid].outs++; if((row.runs||0)===0) stats[pid].ducks++; }
        else if(played){ stats[pid].notOuts++; }
        if((row.runs||0) > stats[pid].highScore) stats[pid].highScore = row.runs||0;
        if((row.runs||0)>=100) stats[pid].hundreds++;
        else if((row.runs||0)>=50) stats[pid].fifties++;
      });
      const bwc = inn.bowlingCard || {};
      Object.keys(bwc).forEach(pid=>{
        if(!stats[pid]) return;
        const row = bwc[pid];
        stats[pid].bMatches.add(m.id);
        stats[pid].oversBalls += row.balls||0;
        stats[pid].runsConceded += row.runs||0;
        stats[pid].wickets += row.wickets||0;
        if((row.wickets||0)>=5) stats[pid].fiveWktHauls++;
        else if((row.wickets||0)>=3) stats[pid].threeWktHauls++;
        const bbStr = (row.wickets||0)+'/'+(row.runs||0);
        if(!stats[pid].bestBowling){ stats[pid].bestBowling = bbStr; stats[pid]._bw=row.wickets||0; stats[pid]._br=row.runs||0; }
        else if((row.wickets||0) > stats[pid]._bw || ((row.wickets||0)===stats[pid]._bw && (row.runs||0) < stats[pid]._br)){
          stats[pid].bestBowling = bbStr; stats[pid]._bw=row.wickets||0; stats[pid]._br=row.runs||0;
        }
      });
      Object.values(inn.history||{}).forEach(b=>{
        if(b.bowler && stats[b.bowler] && !b.wicket && (b.runs||0)===0 && b.extraType!=='wide' && b.extraType!=='noball') stats[b.bowler].dotBallsBowled++;
        if(b.wicket && b.fielder && stats[b.fielder]){
          if(b.wicketType==='Caught') stats[b.fielder].catches++;
          else if(b.wicketType==='Run Out') stats[b.fielder].runOuts++;
          else if(b.wicketType==='Stumped') stats[b.fielder].stumpings++;
        }
      });
    });
    if(m.playerOfMatch && stats[m.playerOfMatch]) stats[m.playerOfMatch].pom++;
  });
  return Object.values(stats).map(s=>({
    ...s,
    matches:s.matches.size, bMatches:s.bMatches.size,
    average: s.outs>0 ? (s.runs/s.outs) : (s.runs>0? s.runs : 0),
    strikeRate: s.balls>0 ? (s.runs/s.balls*100) : 0,
    economy: s.oversBalls>0 ? (s.runsConceded/(s.oversBalls/6)) : 0,
    oversBowled: fmtOvers(s.oversBalls),
    fieldingDismissals: s.catches+s.runOuts+s.stumpings
  }));
}
function matchResultText(m){
  if(!m) return '';
  if(m.result==='tie') return 'Match tied';
  if(m.result==='no-result') return 'No result';
  if(!m.winnerId) return '';
  const winner = S.teams[m.winnerId];
  const wname = winner? (winner.shortName||winner.name) : 'Team';
  if(m.winMargin) return `${wname} won by ${m.winMargin}`;
  return `${wname} won`;
}

function currentInningsOf(m){
  if(!m) return null;
  return m.currentInnings===2 ? (m.innings2||null) : (m.innings1||null);
}
function currentOverBalls(inn){
  const all = Object.values(inn.history||{}).sort((a,b)=>(a.seq||0)-(b.seq||0));
  let legalCount = 0, overBalls = [];
  all.forEach(b=>{
    const isLegal = !(b.extraType==='wide' || b.extraType==='noball');
    if(isLegal && legalCount>0 && legalCount%6===0){ overBalls = []; }
    overBalls.push(b);
    if(isLegal) legalCount++;
  });
  return overBalls;
}
function fallOfWickets(inn){
  const all = Object.values(inn.history||{}).sort((a,b)=>(a.seq||0)-(b.seq||0));

   team tabs, Summary (batting/bowling scorecard) / Timeline tabs

function battingOrder(inn){
  const seen = [];
  Object.values(inn.history||{}).sort((a,b)=>(a.seq||0)-(b.seq||0)).forEach(b=>{
    if(b.batsman && !seen.includes(b.batsman)) seen.push(b.batsman);

}
function bowlingOrder(inn){
  const seen = [];
  Object.values(inn.history||{}).sort((a,b)=>(a.seq||0)-(b.seq||0)).forEach(b=>{
    if(b.bowler && !seen.includes(b.bowler)) seen.push(b.bowler);
  });
  Object.keys(inn.bowlingCard||{}).forEach(pid=>{ if(!seen.includes(pid)) seen.push(pid); });
  return seen;
}
function renderBattingTable(inn){

    const p = S.players[pid] || {};

  }).join('');
  return `<table class="sc-table">
    <tr><th>Batsman</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>
    ${rows}
  </table>
  <div class="sc-extras-row">Extras: ${extrasOf(inn)} &nbsp;·&nbsp; Total: <b>${inn.runs||0}/${inn.wickets||0}</b> (${fmtOvers(inn.balls)} ov)</div>`;

function extrasOf(inn){
  let total = 0;
  Object.values(inn.history||{}).forEach(b=>{ if(b.extraType) total += (b.runs||0); });
  return total;
}
function renderBowlingTable(inn){
  const order = bowlingOrder(inn);
  if(!order.length) return `<p style="font-size:12.5px;color:var(--ink-soft);padding:8px 0;">No bowling data yet.</p>`;
  const rows = order.map(pid=>{
    const row = (inn.bowlingCard||{})[pid] || {balls:0,runs:0,wickets:0};
    const p = S.players[pid] || {};
    const overs = fmtOvers(row.balls);
    const eco = row.balls>0 ? ((row.runs/(row.balls/6))).toFixed(2) : '0.00';
    return `<tr><td class="sc-name"><b>${escapeHtml(p.name||'—')}</b></td><td>${overs}</td><td>${row.runs||0}</td><td>${row.wickets||0}</td><td>${eco}</td></tr>`;
  }).join('');
  return `<table class="sc-table">
    <tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Eco</th></tr>

/* ============================================================
   AUTO MAN OF THE MATCH ENGINE
   Deterministic, computed live from existing batting/bowling/
   fielding data already in the scoreboard — no separate input.
   ============================================================ */
function allMatchPlayerIds(m){
  const ids = [];
  [m.innings1, m.innings2].forEach(inn=>{
    if(!inn) return;
    Object.keys(inn.battingCard||{}).forEach(id=>{ if(!ids.includes(id)) ids.push(id); });
    Object.keys(inn.bowlingCard||{}).forEach(id=>{ if(!ids.includes(id)) ids.push(id); });
    Object.values(inn.history||{}).forEach(b=>{ if(b.fielder && !ids.includes(b.fielder)) ids.push(b.fielder); });
  });
  return ids;
}
function getPlayerMatchStats(m, pid){
  const st = {runs:0,balls:0,fours:0,sixes:0,out:false,batted:false,
              bwlBalls:0,bwlRuns:0,wickets:0,bowled:false,dotBalls:0,
              catches:0,runOuts:0,stumpings:0};
  [m.innings1, m.innings2].forEach(inn=>{
    if(!inn) return;
    const bc = (inn.battingCard||{})[pid];
    if(bc){ st.batted=true; st.runs+=bc.runs||0; st.balls+=bc.balls||0; st.fours+=bc.fours||0; st.sixes+=bc.sixes||0; if(bc.out) st.out=true; }
    const bwc = (inn.bowlingCard||{})[pid];
    if(bwc){ st.bowled=true; st.bwlBalls+=bwc.balls||0; st.bwlRuns+=bwc.runs||0; st.wickets+=bwc.wickets||0; }
    Object.values(inn.history||{}).forEach(b=>{
      if(b.bowler===pid && !b.wicket && (b.runs||0)===0 && b.extraType!=='wide' && b.extraType!=='noball') st.dotBalls++;
      if(b.wicket && b.fielder===pid){
        if(b.wicketType==='Caught') st.catches++;
        else if(b.wicketType==='Run Out') st.runOuts++;
        else if(b.wicketType==='Stumped') st.stumpings++;
      }
    });
  });
  return st;
}
/* Balanced performance score — combines batting, bowling, fielding
   and a small bonus for being on the winning side (match-winning
   contribution), per the tournament's MOM rules. */
function momScoreOf(m, pid, stats){
  const sr = stats.balls>0 ? (stats.runs/stats.balls*100) : 0;
  let battingScore = stats.runs*1 + stats.fours*0.5 + stats.sixes*1;
  if(stats.balls>=8) battingScore += Math.max(0,(sr-100)/10);
  if(stats.batted && !stats.out) battingScore += stats.runs>=15 ? 4 : 1;

  let bowlingScore = stats.wickets*20 + stats.dotBalls*0.5;
  if(stats.bwlBalls>=9){
    const econ = stats.bwlRuns/(stats.bwlBalls/6);
    bowlingScore += Math.max(-5, Math.min(10,(7-econ)*2));
  }
  const fieldingScore = stats.catches*8 + stats.runOuts*10 + stats.stumpings*10;
  const player = S.players[pid]||{};
  const winBonus = (m.winnerId && player.teamId===m.winnerId) ? 3 : 0;
  return Math.round((battingScore + bowlingScore + fieldingScore + winBonus)*100)/100;
}
function compareMOMCandidates(m, a, b){
  if(b.score !== a.score) return b.score - a.score;
  const pa = S.players[a.pid]||{}, pb = S.players[b.pid]||{};
  const aWin = m.winnerId && pa.teamId===m.winnerId, bWin = m.winnerId && pb.teamId===m.winnerId;
  if(aWin!==bWin) return aWin? -1:1;
  if(b.stats.wickets!==a.stats.wickets) return b.stats.wickets-a.stats.wickets;
  if(b.stats.runs!==a.stats.runs) return b.stats.runs-a.stats.runs;
  const aSR = a.stats.balls>0? a.stats.runs/a.stats.balls:0, bSR = b.stats.balls>0? b.stats.runs/b.stats.balls:0;
  if(bSR!==aSR) return bSR-aSR;
  const aEc = a.stats.bwlBalls>0? a.stats.bwlRuns/(a.stats.bwlBalls/6): Infinity;
  const bEc = b.stats.bwlBalls>0? b.stats.bwlRuns/(b.stats.bwlBalls/6): Infinity;
  if(aEc!==bEc) return aEc-bEc;
  const aF = a.stats.catches+a.stats.runOuts+a.stats.stumpings, bF = b.stats.catches+b.stats.runOuts+b.stats.stumpings;
  return bF-aF;
}
/* Returns ranked list [{pid, stats, score}, ...] best first, or [] if no data yet. */
function rankMOMCandidates(m){
  const ids = allMatchPlayerIds(m);
  const candidates = ids.map(pid=>{
    const stats = getPlayerMatchStats(m, pid);
    return {pid, stats, score: momScoreOf(m, pid, stats)};
  });
  candidates.sort((a,b)=>compareMOMCandidates(m,a,b));
  return candidates;
}
function computeAutoMOM(m){
  const ranked = rankMOMCandidates(m);
  return ranked.length ? ranked[0] : null;
}
function momStatLine(stats){
  const parts = [];
  if(stats.batted) parts.push(`${stats.runs} Run${stats.runs!==1?'s':''} • ${stats.balls} Ball${stats.balls!==1?'s':''}${stats.fours?' • '+stats.fours+' Four'+(stats.fours!==1?'s':''):''}${stats.sixes?' • '+stats.sixes+' Six'+(stats.sixes!==1?'es':''):''}`);
  if(stats.bowled) parts.push(`${stats.wickets} Wicket${stats.wickets!==1?'s':''} • ${fmtOvers(stats.bwlBalls)} Overs • ${stats.bwlRuns} Runs${stats.bwlBalls>=6?' • Econ '+((stats.bwlRuns/(stats.bwlBalls/6))).toFixed(2):''}`);
  const fieldTotal = stats.catches+stats.runOuts+stats.stumpings;
  if(fieldTotal) parts.push(`${stats.catches?stats.catches+' Catch'+(stats.catches!==1?'es':''):''}${stats.catches&&(stats.runOuts||stats.stumpings)?' • ':''}${stats.runOuts?stats.runOuts+' Run Out'+(stats.runOuts!==1?'s':''):''}${stats.runOuts&&stats.stumpings?' • ':''}${stats.stumpings?stats.stumpings+' Stumping'+(stats.stumpings!==1?'s':''):''}`);
  return parts.join(' &nbsp;·&nbsp; ');
}
function renderLiveMomRace(m){
  const top = computeAutoMOM(m);
  if(!top) return '';
  const p = S.players[top.pid]||{};
  return `<div class="card card-tight" style="margin-top:10px;background:var(--cream-dim);display:flex;align-items:center;gap:10px;">

      <div style="font-size:12.5px;margin-top:2px;"><b>${escapeHtml(p.name||'—')}</b> — ${momStatLine(top.stats)}</div>
    </div>
  </div>`;
}

  const t1 = S.teams[m.team1Id]||{}; const t2 = S.teams[m.team2Id]||{};
  return `

function getStatsLeaderboards(stats){
  return {
    runs: {title:'🏏 Top Run Scorers', list:[...stats].filter(s=>s.runs>0).sort((a,b)=>b.runs-a.runs), val:s=>String(s.runs)},
    wickets: {title:'🎯 Top Wicket Takers', list:[...stats].filter(s=>s.wickets>0).sort((a,b)=>b.wickets-a.wickets), val:s=>String(s.wickets)},
    sr: {title:'⚡ Highest Strike Rate', list:[...stats].filter(s=>s.balls>=6).sort((a,b)=>b.strikeRate-a.strikeRate), val:s=>s.strikeRate.toFixed(1)},
    econ: {title:'🛡️ Best Economy', list:[...stats].filter(s=>s.oversBalls>=6).sort((a,b)=>a.economy-b.economy), val:s=>s.economy.toFixed(1)},
    sixes: {title:'💥 Most Sixes', list:[...stats].filter(s=>s.sixes>0).sort((a,b)=>b.sixes-a.sixes), val:s=>String(s.sixes)},
    fours: {title:'🔥 Most Fours', list:[...stats].filter(s=>s.fours>0).sort((a,b)=>b.fours-a.fours), val:s=>String(s.fours)},
    milestones: {title:'💯 Most 50s / 100s', list:[...stats].filter(s=>s.hundreds>0||s.fifties>0).sort((a,b)=>(b.hundreds-a.hundreds)||(b.fifties-a.fifties)), val:s=>`${s.hundreds}×100 · ${s.fifties}×50`},
    bb: {title:'🎳 Best Bowling Figures', list:[...stats].filter(s=>s.wickets>0).sort((a,b)=>(b._bw-a._bw)||(a._br-b._br)), val:s=>s.bestBowling},
    hauls: {title:'🏅 3+/5+ Wicket Hauls', list:[...stats].filter(s=>(s.threeWktHauls+s.fiveWktHauls)>0).sort((a,b)=>(b.fiveWktHauls-a.fiveWktHauls)||(b.threeWktHauls-a.threeWktHauls)), val:s=>`${s.fiveWktHauls}×5W · ${s.threeWktHauls}×3W`},
    field: {title:'🧤 Best Fielder (Ct+RO+St)', list:[...stats].filter(s=>s.fieldingDismissals>0).sort((a,b)=>b.fieldingDismissals-a.fieldingDismissals), val:s=>`${s.catches}c · ${s.runOuts}ro · ${s.stumpings}st`},
    pom: {title:'🌟 Player of the Match', list:[...stats].filter(s=>s.pom>0).sort((a,b)=>b.pom-a.pom), val:s=>String(s.pom)}
  };
}

    const label = (SEASONS_LIST[CURRENT_SEASON_ID]||{}).name || CURRENT_SEASON_ID;
    if(!confirm('Delete season "'+label+'"? This permanently removes its teams, players, matches, notices, gallery and settings. This cannot be undone.')) return;
    deleteSeason(CURRENT_SEASON_ID).then(()=>toast('Season deleted','success')).catch(err=>toast(err.message,'error'));
  };

  const main = document.getElementById('adminMain');
  switch(sub){
    case '': renderAdminDashboard(main); break;
    case 'settings': renderAdminSettings(main); break;
    case 'teams': renderAdminTeams(main); break;
    case 'players': renderAdminPlayers(main); break;
    case 'auction': renderAdminAuction(main); break;
    case 'matches': renderAdminMatches(main); break;
    case 'scoring': renderAdminScoring(main); break;
    case 'fixtures': renderAdminFixtures(main); break;
    case 'points': main.innerHTML = `<div class="section-title" style="margin-top:0;"><h2>Points Table (auto-calculated)</h2></div>` + renderPointsTableHtml(computePointsTable(),false); break;
    case 'stats': main.innerHTML = `<div class="section-title" style="margin-top:0;"><h2>Player Statistics (auto-calculated)</h2></div>` + viewStats(); wireStatsButtons(); break;
    case 'graphics': renderAdminGraphics(main); break;
    case 'notices': renderAdminNotices(main); break;
    case 'sponsors': renderAdminSponsors(main); break;
    case 'gallery': renderAdminGallery(main); break;
    case 'rules': renderAdminRules(main); break;
    case 'backup': renderAdminBackup(main); break;
    case 'demo': renderAdminDemo(main); break;
    default: renderAdminDashboard(main);
  }
 }catch(err){
   console.error(err);
   showErrorBanner((err&&err.stack) || (err&&err.message) || String(err));
   app.innerHTML = `<div class="empty-state card"><div class="es-icon">⚠️</div><h3>Something went wrong in Admin</h3><p>An error banner with details is shown at the top of the screen — please screenshot it and share it.</p></div>`;

function openNewSeasonModal(){
  openModal(`
    <div class="modal-head"><h3>Create New Season</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;">A new season gets its own separate teams, players, matches, notices, gallery — completely independent from other seasons.</p>
    <div class="field"><label>Season Name *</label><input type="text" id="nsName" placeholder="EPL 27"></div>
    <div class="field"><label>Short ID (letters/numbers only, no spaces) *</label><input type="text" id="nsId" placeholder="epl27"></div>
    <button class="btn btn-primary btn-block" id="nsCreateBtn">Create & Switch to this Season</button>
  `);
  document.getElementById('nsCreateBtn').onclick = async ()=>{
    const name = document.getElementById('nsName').value.trim();
    let sid = document.getElementById('nsId').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
    if(!name || !sid){ toast('Enter a name and a short ID','error'); return; }
    if(sid==='default'){ toast('"default" is reserved — pick another ID','error'); return; }
    if(SEASONS_LIST[sid]){ toast('That season ID already exists','error'); return; }
    try{
      const updates = {};
      updates['tournamentSeasonsList/'+sid] = { name, createdAt: Date.now() };
      updates['tournamentSeasons/'+sid+'/settings'] = { name, shortName:name.slice(0,6), season:name, status:'upcoming', oversPerInnings:20, updatedAt:Date.now() };
      await db.ref().update(updates);
      toast('Season created','success');
      closeModal();
      switchSeason(sid);
      goAdmin('settings');
    }catch(err){ toast(err.message,'error'); }
  };
}

  ta.oninput = ()=>{ const rows = parseLines(); preview.textContent = rows.length ? (rows.length+' player(s) will be added') : ''; };

  };
}

function renderAdminPlayerRow(p){
  const team = S.teams[p.teamId];
  const statusBadge = p.auctionStatus==='sold' ? `<span class="pill pill-sold">${money(p.auctionPrice)}</span>` :
    p.auctionStatus==='direct' ? `<span class="pill pill-upcoming">Direct ${p.auctionPrice?money(p.auctionPrice):''}</span>` :
    p.auctionStatus==='unsold' ? `<span class="pill pill-unsold">Unsold</span>` : `<span class="pill pill-postponed">Pending</span>`;

    <img class="avatar" src="${cacheBust(p.photo||'', p.updatedAt)}" onerror="this.style.visibility='hidden'">

      <button class="btn btn-sm btn-ghost" data-edit="${p.id}">Edit</button>

function wireAdminPlayerListActions(main){
  main.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=> openPlayerModal(S.players[b.dataset.edit], b.dataset.edit));
  main.querySelectorAll('[data-card]').forEach(b=> b.onclick = ()=> openPlayerCardModal(b.dataset.card));
  main.querySelectorAll('[data-ppdf]').forEach(b=> b.onclick = ()=> generatePlayerPDF(b.dataset.ppdf, false));
  main.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=>{
    const id = b.dataset.del;

      db.ref('players/'+id).remove().then(()=>toast('Player deleted','success')).catch(e=>toast(e.message,'error'));

      .catch(err=>{ toast(err.message,'error'); btn.disabled=false; btn.textContent='Save'; });

}

function auctionPool(category){
  let list = objToArr(S.players).filter(p=> !p.auctionStatus || p.auctionStatus==='pending');
  if(category && category!=='All') list = list.filter(p=>p.category===category);
  return list;
}

function wireAuctionAdmin(a, pool){
  const cardBtn = document.getElementById('auctionCardBtnAdmin');
  if(cardBtn){
    const p = S.players[a.currentPlayerId];
    if(p) cardBtn.onclick = ()=> downloadCanvasCard((withPhotos)=>buildAuctionPlayerCard(p, withPhotos), 'auction-card-'+p.id+'.png');
  }
  const startBtn = document.getElementById('startAuctionBtn');
  if(startBtn) startBtn.onclick = ()=>{
    if(!pool.length){ toast('Auction pool is empty','error'); return; }
    const first = pool[0];
    db.ref(seasonPath('auction')).update({ status:'live', currentPlayerId:first.id, currentBid:first.basePrice, currentTeamId:null, bidIncrement: a.bidIncrement||100 })
      .then(()=>toast('Auction started','success'));
  };
  const pauseBtn = document.getElementById('pauseAuctionBtn');
  if(pauseBtn) pauseBtn.onclick = ()=> db.ref(seasonPath('auction')+'/status').set('paused').then(()=>toast('Auction paused','info'));
  const resumeBtn = document.getElementById('resumeAuctionBtn');
  if(resumeBtn) resumeBtn.onclick = ()=> db.ref(seasonPath('auction')+'/status').set('live').then(()=>toast('Auction resumed','success'));
  const nextBtn = document.getElementById('nextPlayerBtn');
  if(nextBtn) nextBtn.onclick = ()=>{
    const currentIdx = pool.findIndex(p=>p.id===a.currentPlayerId);
    const next = pool[currentIdx+1] || pool[0];
    if(!next){ toast('No more players in pool','error'); return; }
    db.ref(seasonPath('auction')).update({ currentPlayerId:next.id, currentBid:next.basePrice, currentTeamId:null, status:'live' });
  };
  const prevBtn = document.getElementById('prevPlayerBtn');
  if(prevBtn) prevBtn.onclick = ()=>{
    const currentIdx = pool.findIndex(p=>p.id===a.currentPlayerId);
    const prev = pool[currentIdx-1];
    if(!prev){ toast('No previous player','error'); return; }
    db.ref(seasonPath('auction')).update({ currentPlayerId:prev.id, currentBid:prev.basePrice, currentTeamId:null, status:'live' });
  };
  const placeBidBtn = document.getElementById('placeBidBtn');
  if(placeBidBtn) placeBidBtn.onclick = ()=>{
    const teamId = document.getElementById('bidTeam').value;
    const inc = Number(document.getElementById('bidIncrement').value)||100;
    if(!teamId){ toast('Select a team first','error'); return; }
    const current = S.players[a.currentPlayerId];
    const newBid = (a.currentBid || current.basePrice) + inc;
    db.ref(seasonPath('auction')).update({ currentBid:newBid, currentTeamId:teamId, bidIncrement:inc });
  };
  const soldBtn = document.getElementById('soldBtn');
  if(soldBtn) soldBtn.onclick = ()=>{
    if(!a.currentTeamId){ toast('Assign a team before marking sold','error'); return; }
    const playerId = a.currentPlayerId; const price = a.currentBid || S.players[playerId].basePrice; const teamId = a.currentTeamId;
    const updates = {};
    updates['players/'+playerId+'/auctionStatus'] = 'sold';
    updates['players/'+playerId+'/auctionPrice'] = price;
    updates['players/'+playerId+'/teamId'] = teamId;
    const histKey = uid();
    updates['auction/history/'+histKey] = { playerId, teamId, price, status:'sold', ts:Date.now() };
    db.ref().update(updates).then(()=>{
      toast(`${S.players[playerId].name} sold for ${money(price)}`,'success');
      advanceAuction(playerId);
    });
  };
  const unsoldBtn = document.getElementById('unsoldBtn');
  if(unsoldBtn) unsoldBtn.onclick = ()=>{
    const playerId = a.currentPlayerId;
    const updates = {};
    updates['players/'+playerId+'/auctionStatus'] = 'unsold';
    const histKey = uid();
    updates['auction/history/'+histKey] = { playerId, teamId:null, price:0, status:'unsold', ts:Date.now() };
    db.ref().update(updates).then(()=>{
      toast(`${S.players[playerId].name} marked unsold`,'info');
      advanceAuction(playerId);
    });
  };
  const resetBtn = document.getElementById('resetAuctionBtn');
  if(resetBtn) resetBtn.onclick = ()=>{
    const current = S.players[a.currentPlayerId];
    if(current) db.ref(seasonPath('auction')).update({ currentBid:current.basePrice, currentTeamId:null });
  };
  function advanceAuction(justProcessedId){
    const remaining = auctionPool(ADMIN_AUCTION_CATEGORY).filter(p=>p.id!==justProcessedId);
    if(remaining.length){
      const next = remaining[0];
      db.ref(seasonPath('auction')).update({ currentPlayerId:next.id, currentBid:next.basePrice, currentTeamId:null });
    } else {
      db.ref(seasonPath('auction')).update({ currentPlayerId:null, status:'paused' });
      toast('Auction pool complete','info');
    }
  }
}

function openMatchModal(m={}, id=null){
  const teams = objToArr(S.teams);
  openModal(`
    <div class="modal-head"><h3>${id?'Edit':'Add'} Match</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>

        <div class="field"><label>Team 2 *</label><select id="mTeam2" required><option value="">Select…</option>${teams.map(t=>`<option value="${t.id}" ${m.team2Id===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join('')}</select></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="matchSaveBtn">${id?'Save Changes':'Add Match'}</button>

  `);
  document.getElementById('matchForm').onsubmit = (e)=>{
    e.preventDefault();

      stage: document.getElementById('mStage').value,

      time: document.getElementById('mTime').value,

    (id? ref.update(payload) : ref.set(payload)).then(()=>{ toast(id?'Match updated':'Match added','success'); closeModal(); })

function openRoundRobinModal(){
  const teams = objToArr(S.teams);
  if(teams.length<2){ toast('Add at least 2 teams first','error'); return; }
  const existingAuto = objToArr(S.matches).filter(m=>m.autoGenerated && m.stage==='League');
  openModal(`
    <div class="modal-head"><h3>Generate League Fixtures</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">This creates a round-robin fixture — every team plays every other team once (${teams.length} teams → ${teams.length*(teams.length-1)/2} matches).</p>
    ${existingAuto.length? `<div class="field-hint" style="margin-bottom:10px;color:var(--red);">⚠️ ${existingAuto.length} previously auto-generated League matches will be replaced.</div>` : ''}
    <div class="field"><label>Start Date</label><input type="date" id="rrStart" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Days Between Matches</label><input type="number" id="rrGap" value="2" min="1"></div>
    <div class="field"><label>Match Time</label><input type="time" id="rrTime" value="17:00"></div>
    <div class="field"><label>Default Venue</label><input type="text" id="rrVenue" value="${escapeHtml(S.settings.venue||'')}"></div>
    <button class="btn btn-primary btn-block" id="rrGenBtn">Generate ${teams.length*(teams.length-1)/2} Fixtures</button>
  `);
  document.getElementById('rrGenBtn').onclick = async ()=>{
    const start = document.getElementById('rrStart').value;
    const gap = Number(document.getElementById('rrGap').value)||2;
    const time = document.getElementById('rrTime').value;
    const venue = document.getElementById('rrVenue').value.trim();
    if(!start){ toast('Pick a start date','error'); return; }
    const updates = {};
    existingAuto.forEach(m=> updates['matches/'+m.id] = null);
    let count=0;
    const d0 = new Date(start+'T00:00:00');
    for(let i=0;i<teams.length;i++){
      for(let j=i+1;j<teams.length;j++){
        count++;
        const d = new Date(d0); d.setDate(d0.getDate() + (count-1)*gap);
        const key = 'auto_'+teams[i].id+'_'+teams[j].id;
        updates['matches/'+key] = {
          matchNumber:'M'+count, stage:'League', date:d.toISOString().slice(0,10), time, venue,
          team1Id:teams[i].id, team2Id:teams[j].id, status:'upcoming',
          autoGenerated:true, demo:false, seasonId:CURRENT_SEASON_ID, updatedAt:Date.now()
        };
      }
    }
    try{
      await db.ref().update(updates);
      toast(count+' fixtures generated','success');
      closeModal();
    }catch(err){ toast(err.message,'error'); }
  };
}
function openKnockoutModal(){

  if(played.length<2){ toast('Need at least 2 teams with completed matches','error'); return; }
  const sfDone = objToArr(S.matches).filter(m=>m.stage==='Semi Final' && m.status==='completed');
  const sfPending = objToArr(S.matches).filter(m=>m.stage==='Semi Final');
  openModal(`
    <div class="modal-head"><h3>Generate Knockout Stage</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>

      <select id="koFormat">
        <option value="4">Top 4 → Semi Finals + Final</option>
        <option value="2">Top 2 → Final directly</option>

    <div class="field"><label>Date</label><input type="date" id="koDate" value="${new Date().toISOString().slice(0,10)}"></div>

      sfPending.length ? `<div class="field-hint" style="margin-top:10px;">Final can be generated once both Semi Finals are marked completed with a result.</div>` : ''}
  `);
  document.getElementById('koGenBtn').onclick = async ()=>{

    const time = document.getElementById('koTime').value;

      if(fmt==='4'){
        if(played.length<4){ toast('Need at least 4 teams with completed matches for Top 4','error'); return; }
        const [t1,t2,t3,t4] = played;
        updates['matches/auto_sf1'] = { matchNumber:'SF1', stage:'Semi Final', date, time, venue, team1Id:t1.teamId, team2Id:t4.teamId, status:'upcoming', autoGenerated:true, demo:false, seasonId:CURRENT_SEASON_ID, updatedAt:Date.now() };

        updates['matches/auto_sf2'] = { matchNumber:'SF2', stage:'Semi Final', date:d2.toISOString().slice(0,10), time, venue, team1Id:t2.teamId, team2Id:t3.teamId, status:'upcoming', autoGenerated:true, demo:false, seasonId:CURRENT_SEASON_ID, updatedAt:Date.now() };
        await db.ref().update(updates);
        toast('Semi Finals generated (1v4, 2v3)','success');
      } else {
        const [t1,t2] = played;
        updates['matches/auto_final'] = { matchNumber:'Final', stage:'Final', date, time, venue, team1Id:t1.teamId, team2Id:t2.teamId, status:'upcoming', autoGenerated:true, demo:false, seasonId:CURRENT_SEASON_ID, updatedAt:Date.now() };
        await db.ref().update(updates);
        toast('Final generated (1st vs 2nd)','success');
      }
      closeModal();
    }catch(err){ toast(err.message,'error'); }
  };
  const finalBtn = document.getElementById('koFinalBtn');
  if(finalBtn) finalBtn.onclick = async ()=>{
    const [sf1,sf2] = sfDone;
    if(!sf1.winnerId || !sf2.winnerId){ toast('Both Semi Finals need a recorded winner','error'); return; }

/* ============================================================
   ADMIN: LIVE BALL-BY-BALL SCORING ENGINE
   ============================================================ */
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function emptyInnings(battingTeamId, bowlingTeamId, striker, nonStriker, bowler){
  return {
    battingTeamId, bowlingTeamId, runs:0, wickets:0, balls:0,
    striker, nonStriker, bowler, seqCounter:0,
    battingCard:{ [striker]:{runs:0,balls:0,fours:0,sixes:0,out:false,howOut:''}, [nonStriker]:{runs:0,balls:0,fours:0,sixes:0,out:false,howOut:''} },
    bowlingCard:{ [bowler]:{balls:0,runs:0,wickets:0} },
    history:{}
  };
}
function commitMatch(matchId, mutatorFn){
  const match = deepClone(S.matches[matchId]);
  // IMPORTANT: strip any previously-stored undo snapshot before taking the new
  // snapshot. Without this, every single ball's snapshot would contain the
  // previous ball's snapshot nested inside it (since it was round-tripped
  // through Firebase and read back), which doubles in size ball after ball
  // and eventually exceeds Firebase's 10MB per-value limit — breaking ALL
  // further scoring on that match ("set failed: value argument contains a
  // string greater than 10485760 utf8 bytes").
  delete match._undoSnapshot;
  const snapshot = JSON.stringify(match);
  let updated;
  try{ updated = mutatorFn(match); }catch(err){
    console.error('commitMatch mutator error', err);
    toast(err.message,'error'); showErrorBanner('Scoring action failed: '+(err.message||err)); return;
  }
  if(!updated){ return; } // mutator can return falsy to abort
  delete updated._undoSnapshot; // never let a stale/oversized one slip through from the mutator
  updated._undoSnapshot = snapshot;
  updated.updatedAt = Date.now();
  db.ref('matches/'+matchId).set(updated).catch(err=>{
    console.error('commitMatch write error', err);
    // Self-heal: if a match is already stuck with an oversized _undoSnapshot
    // from before this fix, drop undo history for this match and retry once
    // so scoring can continue immediately instead of staying broken.
    if(String(err.message||err).includes('10485760') || String(err.message||err).toLowerCase().includes('too big')){
      const retryVal = {...updated};
      delete retryVal._undoSnapshot;
      db.ref('matches/'+matchId).set(retryVal).then(()=>{
        toast('Fixed an oversized undo-history bug on this match — scoring resumed. (Undo for the last ball is unavailable this one time.)','info');
      }).catch(err2=>{
        toast('Could not save: '+(err2.message||err2),'error');
        showErrorBanner('Ball not saved even after retry — Firebase write failed: '+(err2.message||err2));
      });
      return;
    }
    toast('Could not save: '+(err.message||err),'error');
    showErrorBanner('Ball not saved — Firebase write failed: '+(err.message||err)+'. This usually means you are not signed in as an admin, or the Realtime Database rules are not published. Please re-check Admin login and Firebase rules.');
  });
}

function rotateStrikeIfOdd(inn, runs){
  if(runs % 2 === 1){ const tmp = inn.striker; inn.striker = inn.nonStriker; inn.nonStriker = tmp; }
}
function checkOverEnd(inn){
  if(inn.balls>0 && inn.balls % 6 === 0){
    const tmp = inn.striker; inn.striker = inn.nonStriker; inn.nonStriker = tmp;
    return true;
  }
  return false;
}
function ensureBattingCard(inn, pid){ if(!inn.battingCard) inn.battingCard={}; if(!inn.battingCard[pid]) inn.battingCard[pid] = {runs:0,balls:0,fours:0,sixes:0,out:false,howOut:''}; }
function ensureBowlingCard(inn, pid){ if(!inn.bowlingCard) inn.bowlingCard={}; if(!inn.bowlingCard[pid]) inn.bowlingCard[pid] = {balls:0,runs:0,wickets:0}; }
function pushBall(inn, entry){
  if(!inn.history) inn.history = {};
  inn.seqCounter = (inn.seqCounter||0)+1;
  entry.seq = inn.seqCounter;
  entry.ts = Date.now();
  entry.overDisplay = fmtOvers(inn.balls) ;
  inn.history[uid()] = entry;
}
function inningsShouldEnd(m, inn){
  const allotted = oversPerInningsSetting()*6;
  const squadSize = squadOf(inn.battingTeamId).length || 11;
  // Normally a team is all out one wicket before their squad size (needs 2 batsmen
  // at the crease). With "Last Man Stands" enabled, the very last player can bat
  // alone, so the innings only ends once that last wicket also falls.
  const allOutAt = m.lastManStands ? squadSize : Math.max(1, squadSize-1);
  if(inn.wickets>=allOutAt) return true;
  if(inn.balls>=allotted) return true;
  if(m.currentInnings===2 && m.innings1){
    const target = (m.innings1.runs||0)+1;
    if(inn.runs>=target) return true;
  }
  return false;
}

function wireScoringConsole(m, inn){
  const innKey = 'innings'+(m.currentInnings||1);

  const lastManToggle = document.getElementById('lastManToggle');
  if(lastManToggle) lastManToggle.onchange = ()=>{
    const val = lastManToggle.checked;
    commitMatch(m.id, match=>{ match.lastManStands = val; return match; });
    toast(val ? 'Last Man Stands enabled for this match' : 'Last Man Stands disabled for this match', 'info');
  };

  main_runs: {
    document.querySelectorAll('.run-btn').forEach(b=>{
      b.onclick = ()=>{
        const runs = Number(b.dataset.run);
        commitMatch(m.id, match=>{
          const cur = match[innKey];
          ensureBattingCard(cur, cur.striker); ensureBowlingCard(cur, cur.bowler);
          cur.runs += runs; cur.balls += 1;
          cur.battingCard[cur.striker].runs += runs; cur.battingCard[cur.striker].balls += 1;
          if(runs===4) cur.battingCard[cur.striker].fours += 1;
          if(runs===6) cur.battingCard[cur.striker].sixes += 1;
          cur.bowlingCard[cur.bowler].balls += 1; cur.bowlingCard[cur.bowler].runs += runs;
          pushBall(cur, {runs, extraType:null, wicket:false, batsman:cur.striker, bowler:cur.bowler,
            commentary: runs===0?'No run':runs===4?'FOUR! Great shot.':runs===6?'SIX! Maximum!':runs+' run'+(runs>1?'s':'')});
          rotateStrikeIfOdd(cur, runs);
          const overEnded = checkOverEnd(cur);
          if(inningsShouldEnd(match, cur)){ finalizeInningsEnd(match, m.currentInnings||1); }
          if(overEnded && !inningsShouldEnd(match, cur)) setTimeout(()=>openNextOverBowlerModal(m, innKey), 200);
          return match;
        });
      };
    });
  }

  document.querySelectorAll('.extra-btn').forEach(b=>{
    b.onclick = ()=> openExtraModal(m, innKey, b.dataset.extra);
  });
  document.getElementById('wicketBtn').onclick = ()=> openWicketModal(m, innKey);
  document.getElementById('undoBtn').onclick = ()=>{
    const match = S.matches[m.id];
    if(!match._undoSnapshot){ toast('Nothing to undo','error'); return; }
    db.ref('matches/'+m.id).set(JSON.parse(match._undoSnapshot)).then(()=>toast('Last ball undone','info'));
  };
  document.getElementById('editBallBtn').onclick = ()=> openEditBallModal(m, innKey);
  document.getElementById('endOverBtn').onclick = ()=>{
    commitMatch(m.id, match=>{
      const cur = match[innKey];
      const tmp = cur.striker; cur.striker = cur.nonStriker; cur.nonStriker = tmp;
      return match;
    });
    setTimeout(()=>openNextOverBowlerModal(m, innKey), 200);
  };
  document.getElementById('chgStriker').onclick = ()=> openChangeBatterModal(m, innKey, 'striker');
  document.getElementById('chgNonStriker').onclick = ()=> openChangeBatterModal(m, innKey, 'nonStriker');
  document.getElementById('chgBowler').onclick = ()=> openChangeBowlerModal(m, innKey);
  document.getElementById('endInningsBtn').onclick = ()=>{
    confirmDialog('End innings now?','This closes the current innings early.', ()=>{
      commitMatch(m.id, match=>{ finalizeInningsEnd(match, m.currentInnings||1); return match; });
    }, false);
  };
  const finishBtn = document.getElementById('finishMatchBtn');
  if(finishBtn) finishBtn.onclick = ()=> openFinishMatchModal(m);
}

function finalizeInningsEnd(match, inningsNum){
  if(inningsNum===1){
    match.status='live'; // stays live into 2nd innings setup
    match._awaitingInnings2 = true;
  } else {
    match._awaitingFinish = true;
  }
}

function openExtraModal(m, innKey, extraType){
  const labels = {wide:'Wide',noball:'No Ball',bye:'Bye',legbye:'Leg Bye'};
  openModal(`
    <div class="modal-head"><h3>${labels[extraType]}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">
      ${extraType==='wide'||extraType==='noball' ? 'Enter any additional runs run by the batters (beyond the automatic 1-run penalty).' : 'Enter total runs taken as '+labels[extraType]+'.'}
    </p>
    <div class="field"><label>${extraType==='wide'||extraType==='noball'?'Additional runs':'Runs'}</label><input type="number" id="extraRuns" value="0" min="0" max="6"></div>
    <button class="btn btn-primary btn-block" id="extraSubmitBtn">Add ${labels[extraType]}</button>
  `);
  document.getElementById('extraSubmitBtn').onclick = ()=>{
    const extra = Number(document.getElementById('extraRuns').value)||0;
    commitMatch(m.id, match=>{
      const cur = match[innKey];
      ensureBowlingCard(cur, cur.bowler);
      if(extraType==='wide' || extraType==='noball'){
        const total = 1 + extra;
        cur.runs += total;
        cur.bowlingCard[cur.bowler].runs += total;
        pushBall(cur, {runs:total, extraType, wicket:false, batsman:cur.striker, bowler:cur.bowler,
          commentary: (extraType==='wide'?'WIDE':'NO BALL') + (extra? ', +'+extra+' run'+(extra>1?'s':''):'') });
        rotateStrikeIfOdd(cur, extra);
      } else {
        ensureBattingCard(cur, cur.striker);
        cur.runs += extra; cur.balls += 1;
        cur.battingCard[cur.striker].balls += 1;
        cur.bowlingCard[cur.bowler].balls += 1;
        pushBall(cur, {runs:extra, extraType, wicket:false, batsman:cur.striker, bowler:cur.bowler,
          commentary: extra+' '+(extraType==='bye'?'bye':'leg bye')+(extra>1?'s':'')});
        rotateStrikeIfOdd(cur, extra);
        const overEnded = checkOverEnd(cur);
        if(overEnded && !inningsShouldEnd(match, cur)) setTimeout(()=>openNextOverBowlerModal(m, innKey),200);
      }
      if(inningsShouldEnd(match, cur)) finalizeInningsEnd(match, match.currentInnings||1);
      return match;
    });
    closeModal();
  };
}

      if(who==='striker') c.battingCard[c.striker].runs += runs;
      ensureBattingCard(c, outPid);
      c.battingCard[outPid].out = true; c.battingCard[outPid].howOut = wType + (fielder && S.players[fielder] ? (wType==='Stumped'?' st. '+S.players[fielder].name:' c. '+S.players[fielder].name) : '');
      c.bowlingCard[c.bowler].balls += 1;
      if(wType!=='Run Out' && wType!=='Other') c.bowlingCard[c.bowler].wickets += 1;
      pushBall(c, {runs, extraType:null, wicket:true, wicketType:wType, fielder, batsman:outPid, bowler:c.bowler,
        commentary: 'WICKET! '+ (S.players[outPid]||{}).name + ' ' + wType.toLowerCase() + (fielder && S.players[fielder]? ' ('+S.players[fielder].name+')':'') + (runs? ', '+runs+' run'+(runs>1?'s':'')+' completed':'')});
      if(nextBatsman){ ensureBattingCard(c, nextBatsman); if(outPid===c.striker) c.striker = nextBatsman; else c.nonStriker = nextBatsman; }
      else if(!inningsShouldEnd(match, c)){
        // Last Man Stands: no replacement batsman is available but the innings
        // continues (match.lastManStands is on) — the surviving not-out
        // batsman keeps batting alone (both crease slots point to them).
        const survivor = outPid===c.striker ? c.nonStriker : c.striker;
        c.striker = survivor; c.nonStriker = survivor;
      }
      rotateStrikeIfOdd(c, runs);
      const overEnded = checkOverEnd(c);
      if(inningsShouldEnd(match, c)) finalizeInningsEnd(match, match.currentInnings||1);
      else if(overEnded) setTimeout(()=>openNextOverBowlerModal(m, innKey),200);
      return match;
    });
    closeModal();
  };
}

function openNextOverBowlerModal(m, innKey){
  try{
    const match = S.matches[m.id];

    const inn = match[innKey];
    if(!inn) return;
    const squad = squadOf(inn.bowlingTeamId);
    const lastBowler = inn.bowler;
    const firstAvailable = (squad.find(p=>p.id!==lastBowler)||{}).id;
    openModal(`
      <div class="modal-head"><h3>🎯 Over Complete — Select Next Bowler</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;">The same bowler can't bowl two overs in a row. (You can also close this and use "🎯 Change Bowler" below any time.)</p>
      <div class="field"><label>Next Bowler</label>
        <select id="nextBwlSel">
          ${squad.map(p=>`<option value="${p.id}" ${p.id===lastBowler?'disabled':(p.id===firstAvailable?'selected':'')}>${escapeHtml(p.name)}${p.id===lastBowler?' (bowled last over)':''}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-primary btn-block" id="nextBwlSubmit">Confirm Bowler</button>
    `);

    if(submitBtn) submitBtn.onclick = ()=>{
      try{
        const sel = document.getElementById('nextBwlSel');
        const pid = sel ? sel.value : '';
        if(!pid){ toast('Please pick a bowler','error'); return; }
        if(pid===lastBowler && firstAvailable){ toast('Please pick a different bowler','error'); return; }
        commitMatch(m.id, match2=>{ const c = match2[innKey]; ensureBowlingCard(c, pid); c.bowler = pid; return match2; });
        closeModal();
      }catch(err){
        console.error(err);
        toast('Could not set bowler: '+(err.message||err),'error');
        showErrorBanner('Next-bowler selection failed: '+(err.message||err)+'. Please close this popup and use the "🎯 Change Bowler" button instead.');

    };

    console.error(err);

  }

function openFinishMatchModal(m){
  const inn1 = m.innings1, inn2 = m.innings2;
  const allPlayers = [...squadOf(m.team1Id), ...squadOf(m.team2Id)];
  let winnerId=null, margin='', resultType='win';
  if(inn1 && inn2){
    if(inn1.runs===inn2.runs){ resultType='tie'; }
    else {
      const firstBatTeam = inn1.battingTeamId, secondBatTeam = inn2.battingTeamId;
      if(inn2.runs > inn1.runs){ winnerId = secondBatTeam; const wicketsLeft = 10-(inn2.wickets||0); margin = wicketsLeft+' wicket'+(wicketsLeft!==1?'s':''); }
      else { winnerId = firstBatTeam; const runMargin = inn1.runs-inn2.runs; margin = runMargin+' run'+(runMargin!==1?'s':''); }
    }
  }
  const mForMOM = {...m, winnerId, result:resultType};
  const ranked = rankMOMCandidates(mForMOM);
  const autoPick = ranked[0] || null;
  const rankedIds = ranked.map(r=>r.pid);
  const restPlayers = allPlayers.filter(p=>!rankedIds.includes(p.id));
  openModal(`
    <div class="modal-head"><h3>Finish Match</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="card card-tight" style="margin-bottom:14px;background:var(--cream-dim);">
      <b>${resultType==='tie'?'Match Tied':escapeHtml((S.teams[winnerId]||{}).name||'')+' won by '+margin}</b>
    </div>
    ${ranked.length? `<div class="card card-tight" style="margin-bottom:14px;">
      <b style="font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;">⚡ Auto Man of the Match — top performers</b>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
        ${ranked.slice(0,3).map((r,i)=>{
          const p = S.players[r.pid]||{};
          return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;${i===0?'font-weight:700;':''}">
            <span>${i===0?'🏆 ':''}${escapeHtml(p.name||'—')}<span style="color:var(--ink-soft);font-weight:500;"> — ${momStatLine(r.stats)}</span></span>
            <span style="color:var(--pitch-700);font-weight:700;flex-shrink:0;">${r.score}</span>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}
    <div class="field"><label>Player of the Match</label>
      <select id="pomSel">
        <option value="">— None —</option>
        ${ranked.map(r=>{ const p=S.players[r.pid]||{}; return `<option value="${r.pid}" ${autoPick&&autoPick.pid===r.pid?'selected':''}>${escapeHtml(p.name)}${autoPick&&autoPick.pid===r.pid?' (Auto pick)':''}</option>`; }).join('')}
        ${restPlayers.length? `<option disabled>──────────</option>${restPlayers.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}` : ''}
      </select>
    </div>
    <button class="btn btn-primary btn-block" id="finishSubmitBtn">🏁 Confirm & Finish Match</button>
  `);
  document.getElementById('finishSubmitBtn').onclick = ()=>{
    const pom = document.getElementById('pomSel').value || null;
    const mode = (autoPick && pom===autoPick.pid) ? 'auto' : (pom ? 'manual' : 'auto');
    commitMatch(m.id, match=>{
      match.status='completed';
      match.result = resultType;
      match.winnerId = winnerId;
      match.winMargin = margin;
      match.playerOfMatch = pom;
      match.manOfTheMatchMode = mode;
      match.manOfTheMatchAuto = autoPick ? autoPick.pid : null;
      delete match._awaitingFinish;
      return match;
    });
    toast('Match finished — points table updated','success');
    closeModal();
  };
}

    </div>
  `);
  const saveWith = (pid, mode)=>{

    saveWith(pid, (autoPick && pid===autoPick.pid) ? 'auto' : (pid? 'manual':'auto'));

  document.getElementById('exportBtn').onclick = async ()=>{

    const data = snap.val() || {};
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `epl-backup-${new Date().toISOString().slice(0,10)}.json`;
