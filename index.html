    URL.revokeObjectURL(url);
    toast('Backup downloaded','success');
  };

    if(!file){ toast('Choose a backup JSON file first','error'); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      let data;
      try{ data = JSON.parse(e.target.result); }catch(err){ toast('Invalid JSON file','error'); return; }
      confirmDialog('Overwrite all data?', 'This replaces the entire database with the contents of this backup file. This cannot be undone.', ()=>{

    };

  };

function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function daysFromNow(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function demoInnings(battingTeamId, bowlingTeamId, batSquad, bowlSquad, runs, wickets, balls){
  const battingCard = {};
  batSquad.forEach((pid,i)=>{
    const out = i < wickets;
    const r = Math.max(0, Math.round((runs/8) + (i===2? runs*0.2:0) - i*2));
    battingCard[pid] = { runs:r, balls: Math.max(4, r>0? Math.round(r*1.3):6), fours: i===2?4:1, sixes: i===2?2:0, out, howOut: out?'Caught':'' };
  });
  const bowlingCard = {};
  bowlSquad.slice(0,5).forEach((pid,i)=>{
    bowlingCard[pid] = { balls: 24, runs: 15+i*4, wickets: i<2? (i+1): 0 };
  });
  return {
    battingTeamId, bowlingTeamId, runs, wickets, balls,
    striker: batSquad[Math.min(wickets,batSquad.length-2)], nonStriker: batSquad[Math.min(wickets+1,batSquad.length-1)], bowler: bowlSquad[0],
    battingCard, bowlingCard, seqCounter:0,
    history: { demoBall1:{seq:1,over:'',ballInOver:1,runs:4,extraType:null,wicket:false,batsman:batSquad[2],bowler:bowlSquad[0],commentary:'FOUR! Great shot.',overDisplay: fmtOvers(balls-6),ts:Date.now()-600000},
               demoBall2:{seq:2,over:'',ballInOver:2,runs:0,extraType:null,wicket:true,wicketType:'Bowled',batsman:batSquad[0],bowler:bowlSquad[0],commentary:'WICKET! '+demoName(0)+' bowled',overDisplay: fmtOvers(balls-3),ts:Date.now()-500000} }
  };
}

   ============================================================ */
function loadImageSafe(url){
  return new Promise((resolve)=>{
    if(!url){ resolve(null); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=> resolve(img);
    img.onerror = ()=> resolve(null);
    img.src = url;
  });
}
function drawCoverImage(ctx, img, x, y, w, h){
  if(!img){ ctx.fillStyle = '#dcd4bd'; ctx.fillRect(x,y,w,h); return; }
  const ir = img.width/img.height, r = w/h;
  let sw,sh,sx,sy;
  if(ir>r){ sh=img.height; sw=sh*r; sx=(img.width-sw)/2; sy=0; }
  else { sw=img.width; sh=sw/r; sx=0; sy=(img.height-sh)/2; }
  ctx.drawImage(img, sx,sy,sw,sh, x,y,w,h);
}
function roundRectPath(ctx, x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

async function generatePlayerCardCanvas(playerId){
  const p = S.players[playerId]; if(!p) return null;
  const team = S.teams[p.teamId] || {};
  const s = S.settings || {};
  const W=700,H=880;
  const canvas = document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0a2e1f'); grad.addColorStop(1,'#155234');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  // decorative gold stripe
  ctx.fillStyle = '#d7a63b'; ctx.fillRect(0,H-90,W,10);
  // tournament header
  const logoImg = await loadImageSafe(s.logo);
  if(logoImg){ ctx.save(); roundRectPath(ctx, 30,30,64,64,12); ctx.clip(); drawCoverImage(ctx, logoImg, 30,30,64,64); ctx.restore(); }
  ctx.fillStyle = '#f0d488'; ctx.font = '700 26px Arial'; ctx.textBaseline='middle';
  ctx.fillText((s.shortName||s.name||'EPL').toUpperCase(), logoImg?108:30, 62);
  ctx.font = '400 16px Arial'; ctx.fillStyle='#cfe6d8';

async function generateTeamBannerCanvas(teamId){
  const t = S.teams[teamId]; if(!t) return null;
  const s = S.settings || {};
  const squad = objToArr(S.players).filter(p=>p.teamId===teamId);
  const cols = 4;
  const rows = Math.max(1, Math.ceil(squad.length/cols));
  const W=1000, headerH=200, cardW=220, cardH=260, pad=20;
  const H = headerH + rows*cardH + (rows+1)*pad + 60;
  const canvas = document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  const bgImg = await loadImageSafe(t.banner);
  if(bgImg) drawCoverImage(ctx, bgImg, 0,0,W,headerH);
  else { ctx.fillStyle='#0f3d29'; ctx.fillRect(0,0,W,headerH); }
  ctx.fillStyle='rgba(10,46,31,0.72)'; ctx.fillRect(0,0,W,headerH);
  const logoImg = await loadImageSafe(t.logo);
  if(logoImg){ ctx.save(); roundRectPath(ctx,30,30,120,120,16); ctx.clip(); drawCoverImage(ctx, logoImg, 30,30,120,120); ctx.restore(); }
  ctx.fillStyle='#ffffff'; ctx.font='800 44px Arial'; ctx.textBaseline='alphabetic';
  ctx.fillText(t.name||'Team', 170, 90);
  ctx.fillStyle='#d7a63b'; ctx.font='600 20px Arial';

  ctx.fillStyle='#cfe6d8'; ctx.font='500 16px Arial';
  ctx.fillText(squad.length+' Players', 170, 155);
  // squad grid
  let idx=0;
  for(const p of squad){
    const col = idx % cols, row = Math.floor(idx/cols);
    const x = pad + col*(cardW+pad), y = headerH + pad + row*(cardH+pad);
    ctx.fillStyle = '#ffffff'; roundRectPath(ctx,x,y,cardW,cardH,14); ctx.fill();
    const photoImg = await loadImageSafe(p.photo);
    ctx.save(); roundRectPath(ctx, x+20, y+16, cardW-40, cardW-40, 12); ctx.clip();
    if(photoImg) drawCoverImage(ctx, photoImg, x+20, y+16, cardW-40, cardW-40);
    else { ctx.fillStyle='#ece5d3'; ctx.fillRect(x+20,y+16,cardW-40,cardW-40); }
    ctx.restore();
    ctx.fillStyle='#12201a'; ctx.font='700 17px Arial'; ctx.textAlign='center';
    ctx.fillText((p.name||'').length>16? p.name.slice(0,15)+'…' : (p.name||''), x+cardW/2, y+cardW-16);
    ctx.fillStyle='#4b5b52'; ctx.font='500 13px Arial';
    ctx.fillText((p.role||'')+(p.jersey?' · #'+p.jersey:''), x+cardW/2, y+cardW+6);
    ctx.textAlign='left';
    idx++;
  }
  return canvas;
}
async function canvasToShareOrDownload(canvas, filename){
  return new Promise(resolve=>{
    canvas.toBlob(async (blob)=>{
      if(!blob){ resolve(); return; }
      const file = new File([blob], filename, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:filename}); resolve(); return; }catch(e){ /* fall through to download */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 3000);
      resolve();
    }, 'image/png');
  });
}

/* ============================================================
   DOWNLOADABLE PHOTO CARDS (Canvas-based PNG generator)
   Used for: Top-5 stat leaderboard cards, Man of the Match cards,
   and Auction player cards. Player photos are drawn best-effort —
   if a photo can't be loaded (missing / CORS-blocked), a colored
   initial-avatar is drawn instead so the download never fails.
   ============================================================ */
function loadImageSafe(url){
  return new Promise(resolve=>{
    if(!url){ resolve(null); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    let done=false;
    img.onload = ()=>{ if(!done){ done=true; resolve(img); } };
    img.onerror = ()=>{ if(!done){ done=true; resolve(null); } };
    img.src = url;
    setTimeout(()=>{ if(!done){ done=true; resolve(null); } }, 4000);
  });
}
function cardAvatarColor(name){
  const colors = ['#1c6b43','#b3402f','#2b5a8a','#8a5a12','#5a2b8a','#0a6b6b','#a3341f','#2f6b4a'];
  let h=0; for(let i=0;i<(name||'').length;i++) h = (h*31 + name.charCodeAt(i))>>>0;
  return colors[h%colors.length];
}
function drawCardAvatar(ctx, img, name, cx, cy, r){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.closePath(); ctx.clip();
  if(img){
    const scale = Math.max((r*2)/img.width, (r*2)/img.height);
    const w = img.width*scale, h = img.height*scale;
    ctx.drawImage(img, cx-w/2, cy-h/2, w, h);
  } else {
    ctx.fillStyle = cardAvatarColor(name);
    ctx.fillRect(cx-r, cy-r, r*2, r*2);
    ctx.fillStyle = '#fff'; ctx.font = 'bold '+Math.round(r*0.9)+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText((name||'?').charAt(0).toUpperCase(), cx, cy+1);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.strokeStyle='rgba(215,166,59,.9)'; ctx.lineWidth=3; ctx.stroke();
}
function cardHeader(ctx, W, title, subtitle){
  const grad = ctx.createLinearGradient(0,0,0,140);
  grad.addColorStop(0,'#0a2e1f'); grad.addColorStop(1,'#123a27');

  ctx.fillStyle = '#d7a63b'; ctx.fillRect(0,0,W,5);
  ctx.fillStyle = '#f0d488'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(title, 30, 62);
  ctx.fillStyle = '#cfe6d8'; ctx.font = '15px sans-serif';
  ctx.fillText(subtitle, 30, 90);
}

async function buildMomCard(m, usePhotos){

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0a2e1f'); grad.addColorStop(1,'#1c3a27');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#d7a63b'; ctx.fillRect(0,0,W,6);
  ctx.textAlign='center';
  ctx.fillStyle='#f0d488'; ctx.font='bold 20px sans-serif';
  ctx.fillText('🏆  MAN OF THE MATCH', W/2, 56);

  ctx.fillText(`${escapeHtml(t1.shortName||t1.name||'')} vs ${escapeHtml(t2.shortName||t2.name||'')}`, W/2, 80);
  const img = usePhotos ? await loadImageSafe(pom.photo) : null;
  drawCardAvatar(ctx, img, pom.name, W/2, 190, 82);
  ctx.fillStyle='#fff'; ctx.font='bold 32px sans-serif';
  ctx.fillText(pom.name||'—', W/2, 315);
  ctx.fillStyle='#d7a63b'; ctx.font='16px sans-serif';
  ctx.fillText(team.shortName||team.name||'', W/2, 342);
  // stat pills
  const pills = [];
  if(stats.batted) pills.push(`${stats.runs} Runs`, `${stats.balls} Balls`, stats.fours?`${stats.fours} Fours`:null, stats.sixes?`${stats.sixes} Sixes`:null);
  if(stats.bowled) pills.push(`${stats.wickets} Wkts`, `${fmtOvers(stats.bwlBalls)} Ov`, `${stats.bwlRuns} Runs`);
  const fieldTotal = stats.catches+stats.runOuts+stats.stumpings;
  if(fieldTotal) pills.push(`${fieldTotal} Field. Dis.`);
  const clean = pills.filter(Boolean);
  ctx.font='bold 15px sans-serif';
  let totalW=0; const widths=clean.map(p=>{ const w=ctx.measureText(p).width+28; totalW+=w+10; return w; });
  let px = W/2 - totalW/2, py=390;
  clean.forEach((p,i)=>{
    const w = widths[i];

async function buildAuctionPlayerCard(p, usePhotos){
  // Distinct "auction ticket" design: near-black/navy card with a gold frame
  // and a squared (not circular) photo, to look different from the other card types.
  const team = p.teamId ? S.teams[p.teamId] : null;
  const W=640,H=520;
  const canvas = document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#0b0f14'); grad.addColorStop(1,'#1a1f28');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  // gold frame
  ctx.strokeStyle='#d7a63b'; ctx.lineWidth=4; ctx.strokeRect(14,14,W-28,H-28);
  ctx.strokeStyle='rgba(215,166,59,.4)'; ctx.lineWidth=1; ctx.strokeRect(22,22,W-44,H-44);
  ctx.textAlign='center';
  ctx.fillStyle='#d7a63b'; ctx.font='bold 13px sans-serif';
  ctx.fillText('P L A Y E R   A U C T I O N   C A R D', W/2, 48);
  // squared photo frame (distinct from the circular avatars on other cards)
  const img = usePhotos ? await loadImageSafe(p.photo) : null;
  const bx=W/2-90, by=70, bs=180;
  ctx.save();
  ctx.beginPath(); ctx.rect(bx,by,bs,bs); ctx.clip();
  if(img){
    const scale = Math.max(bs/img.width, bs/img.height);
    const w=img.width*scale, h=img.height*scale;
    ctx.drawImage(img, bx+bs/2-w/2, by+bs/2-h/2, w, h);
  } else {
    ctx.fillStyle = cardAvatarColor(p.name); ctx.fillRect(bx,by,bs,bs);
    ctx.fillStyle='#fff'; ctx.font='bold 64px sans-serif'; ctx.textBaseline='middle';
    ctx.fillText((p.name||'?').charAt(0).toUpperCase(), bx+bs/2, by+bs/2+4);
    ctx.textBaseline='alphabetic';
  }
  ctx.restore();
  ctx.strokeStyle='#d7a63b'; ctx.lineWidth=3; ctx.strokeRect(bx,by,bs,bs);
  ctx.fillStyle='#fff'; ctx.font='bold 28px sans-serif';
  ctx.fillText(p.name||'—', W/2, 296);
  ctx.fillStyle='#d7a63b'; ctx.font='14px sans-serif';
  ctx.fillText((p.role||'')+(p.category?'  ·  Category '+p.category:''), W/2, 320);
  // two price boxes side by side: BASE PRICE and SOLD PRICE
  const boxW=250, boxH=72, gap=16, startX = W/2 - (boxW*2+gap)/2, boxY=344;
  function priceBox(x, label, value, highlight){
    ctx.fillStyle = highlight ? 'rgba(215,166,59,.18)' : 'rgba(255,255,255,.06)';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,boxY,boxW,boxH,10) : ctx.rect(x,boxY,boxW,boxH); ctx.fill();
    ctx.strokeStyle = highlight ? '#d7a63b' : 'rgba(255,255,255,.15)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,boxY,boxW,boxH,10) : ctx.rect(x,boxY,boxW,boxH); ctx.stroke();
    ctx.fillStyle='#9fb0a6'; ctx.font='11px sans-serif';
    ctx.fillText(label, x+boxW/2, boxY+24);
    ctx.fillStyle = highlight ? '#f0d488' : '#fff'; ctx.font='bold 22px sans-serif';
    ctx.fillText(value, x+boxW/2, boxY+52);
  }
  priceBox(startX, 'BASE PRICE', money(p.basePrice||0), false);
  priceBox(startX+boxW+gap, 'SOLD PRICE', p.auctionStatus==='sold' ? money(p.auctionPrice||0) : '— Unsold yet —', p.auctionStatus==='sold');
  if(team){
    ctx.fillStyle='#d7a63b'; ctx.font='bold 16px sans-serif';
    ctx.fillText('SOLD TO  →  '+(team.name||''), W/2, 448);
  } else {
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='14px sans-serif';
    ctx.fillText(p.auctionStatus==='unsold' ? 'UNSOLD' : 'IN AUCTION POOL', W/2, 448);
  }
  ctx.fillStyle='rgba(255,255,255,.45)'; ctx.font='11.5px sans-serif';
  ctx.fillText('Generated by '+(S.settings.name||'Tournament App'), W/2, H-24);
  ctx.textAlign='left';
  return canvas;
}
async function downloadCanvasCard(buildFn, filename){
  try{
    let canvas = await buildFn(true);
    let url;
    try{ url = canvas.toDataURL('image/png'); }
    catch(err){ canvas = await buildFn(false); url = canvas.toDataURL('image/png'); } // tainted canvas fallback: redraw without photos
    const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  }catch(err){
    console.error(err); toast('Could not generate card: '+(err.message||err),'error');
  }
}

/* ============================================================
   GRAPHICS STUDIO — cool navy/teal/mint social-media card
   generator (Player Card, Team Banner, Sold Card). Separate
   palette from the app's own green/gold UI theme, on purpose —
   this is an export-design system, not the app chrome.
   ============================================================ */
const GFX = {
  bg1:'#0c2233', bg2:'#123344', panel:'rgba(255,255,255,.05)', panelBorder:'rgba(255,255,255,.10)',
  teal:'#22b8a1', mint:'#7fe3c8', gold:'#d8ae55', textLight:'#eef6f3', textMuted:'#93b0ac', textFaint:'rgba(238,246,243,.55)'
};
function gfxRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ ctx.roundRect(x,y,w,h,r); } else { ctx.rect(x,y,w,h); }
}
function gfxBackground(ctx, W, H){
  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, GFX.bg1); grad.addColorStop(1, GFX.bg2);
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
}
function gfxHeaderBrand(ctx, x, y, logoImg, tournamentName, season){
  if(logoImg){ ctx.save(); gfxRoundRect(ctx,x,y,40,40,8); ctx.clip(); ctx.drawImage(logoImg,x,y,40,40); ctx.restore(); }
  else { ctx.fillStyle=GFX.panel; gfxRoundRect(ctx,x,y,40,40,8); ctx.fill(); ctx.fillStyle=GFX.gold; ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🏆',x+20,y+21); ctx.textAlign='left'; ctx.textBaseline='alphabetic'; }
  ctx.fillStyle = GFX.textLight; ctx.font='bold 13px sans-serif';
  ctx.fillText((tournamentName||'TOURNAMENT').toUpperCase(), x+50, y+17);
  ctx.fillStyle = GFX.mint; ctx.font='11px sans-serif';
  ctx.fillText((season||'').toUpperCase(), x+50, y+32);
}
function gfxStatBox(ctx, x, y, w, h, label, value){
  ctx.fillStyle = GFX.panel; gfxRoundRect(ctx,x,y,w,h,10); ctx.fill();
  ctx.strokeStyle = GFX.panelBorder; ctx.lineWidth=1; gfxRoundRect(ctx,x,y,w,h,10); ctx.stroke();
  ctx.textAlign='center';
  ctx.fillStyle = GFX.textMuted; ctx.font='10.5px sans-serif';
  ctx.fillText(label.toUpperCase(), x+w/2, y+h/2-6);
  ctx.fillStyle = GFX.textLight; ctx.font='bold 20px sans-serif';
  ctx.fillText(String(value), x+w/2, y+h/2+18);
  ctx.textAlign='left';
}
async function buildPlayerCardGraphic(p, usePhotos){
  const team = p.teamId ? S.teams[p.teamId] : null;

  gfxBackground(ctx,W,H);
  const logoImg = usePhotos ? await loadImageSafe(s.logo) : null;
  gfxHeaderBrand(ctx, 34, 30, logoImg, s.name, s.season);
  // role badge top-right
  if(p.role){
    ctx.font='bold 12px sans-serif'; const rw = ctx.measureText(p.role.toUpperCase()).width+28;
    ctx.fillStyle=GFX.panel; gfxRoundRect(ctx,W-34-rw,34,rw,30,15); ctx.fill();
    ctx.strokeStyle=GFX.panelBorder; gfxRoundRect(ctx,W-34-rw,34,rw,30,15); ctx.stroke();
    ctx.fillStyle=GFX.mint; ctx.textAlign='center'; ctx.fillText(p.role.toUpperCase(), W-34-rw/2, 53); ctx.textAlign='left';
  }
  // photo
  const photoImg = usePhotos ? await loadImageSafe(p.photo) : null;
  const px=34, py=96, pw=W-68, ph=460;
  ctx.save(); gfxRoundRect(ctx,px,py,pw,ph,20); ctx.clip();

  else { ctx.fillStyle=cardAvatarColor(p.name); ctx.fillRect(px,py,pw,ph); ctx.fillStyle='#fff'; ctx.font='bold 140px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText((p.name||'?').charAt(0).toUpperCase(), px+pw/2, py+ph/2); ctx.textAlign='left'; ctx.textBaseline='alphabetic'; }
  const shade = ctx.createLinearGradient(0,py+ph-140,0,py+ph); shade.addColorStop(0,'rgba(12,34,51,0)'); shade.addColorStop(1,'rgba(12,34,51,.85)');
  ctx.fillStyle=shade; ctx.fillRect(px,py+ph-140,pw,140);
  ctx.restore();
  ctx.strokeStyle=GFX.panelBorder; ctx.lineWidth=1.5; gfxRoundRect(ctx,px,py,pw,ph,20); ctx.stroke();
  // name + jersey (overlaid bottom of photo)
  ctx.fillStyle='#fff'; ctx.font='bold 34px sans-serif';

  ctx.fillStyle=GFX.mint; ctx.font='16px sans-serif';
  ctx.fillText(p.jersey? '#'+p.jersey : '', px+22, py+ph-30);
  if(team){
    const teamLogoImg = usePhotos ? await loadImageSafe(team.logo) : null;
    const tx = px+pw-140;
    if(teamLogoImg){ ctx.save(); gfxRoundRect(ctx,tx,py+ph-56,26,26,6); ctx.clip(); ctx.drawImage(teamLogoImg,tx,py+ph-56,26,26); ctx.restore(); }
    ctx.fillStyle='#fff'; ctx.font='13px sans-serif'; ctx.textAlign='left';
    ctx.fillText(team.shortName||team.name||'', tx+32, py+ph-38);
  }
  let y = py+ph+36;
  // age/height/weight row — only if present
  const bioFields = [ p.age?['AGE',p.age]:null, p.height?['HEIGHT',p.height]:null, p.weight?['WEIGHT',p.weight]:null ].filter(Boolean);
  if(bioFields.length){
    const bw = (W-68-(bioFields.length-1)*12)/bioFields.length;
    bioFields.forEach((f,i)=> gfxStatBox(ctx, 34+i*(bw+12), y, bw, 74, f[0], f[1]));
    y += 74+26;
  }
  // stats grid — only fields with real data
  if(stats){
    const cells = [];
    if(stats.runs>0 || stats.innings>0) cells.push(['RUNS', stats.runs]);
    if(stats.wickets>0) cells.push(['WICKETS', stats.wickets]);
    if(stats.balls>=6) cells.push(['AVG', stats.average.toFixed(1)]);
    if(stats.matches>0) cells.push(['MATCHES', stats.matches]);
    if(cells.length){
      const cw = (W-68-(cells.length-1)*12)/cells.length;
      cells.forEach((c,i)=> gfxStatBox(ctx, 34+i*(cw+12), y, cw, 88, c[0], c[1]));
      y += 88+26;
    }
  }
  // playing style line
  const styleParts = [p.battingStyle, p.bowlingStyle].filter(Boolean);
  if(styleParts.length){
    ctx.fillStyle=GFX.panel; gfxRoundRect(ctx,34,y,W-68,60,12); ctx.fill();
    ctx.strokeStyle=GFX.panelBorder; gfxRoundRect(ctx,34,y,W-68,60,12); ctx.stroke();
    ctx.fillStyle=GFX.textMuted; ctx.font='10.5px sans-serif'; ctx.fillText('PLAYING STYLE', 52, y+24);
    ctx.fillStyle=GFX.textLight; ctx.font='bold 15px sans-serif'; ctx.fillText(styleParts.join('   •   '), 52, y+45);
  }
  ctx.fillStyle=GFX.textFaint; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText((s.name||'Tournament')+' — Player Card', W/2, H-20);
  ctx.textAlign='left';
  return canvas;
}

      ${GFX_TAB==='player'? `<select id="gfxPlayerSel" style="flex:1;min-width:200px;padding:9px;border:1.5px solid var(--line);border-radius:8px;">${players.length?players.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join(''):'<option value="">No players yet</option>'}</select>`:''}
      ${GFX_TAB==='team'? `<select id="gfxTeamSel" style="flex:1;min-width:200px;padding:9px;border:1.5px solid var(--line);border-radius:8px;">${teams.length?teams.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join(''):'<option value="">No teams yet</option>'}</select>`:''}
      ${GFX_TAB==='sold'? `<select id="gfxSoldSel" style="flex:1;min-width:200px;padding:9px;border:1.5px solid var(--line);border-radius:8px;">${soldPlayers.length?soldPlayers.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join(''):'<option value="">No sold players yet</option>'}</select>
        <select id="gfxSoldAspect" style="padding:9px;border:1.5px solid var(--line);border-radius:8px;"><option value="1:1">Square (1:1)</option><option value="4:5">Portrait (4:5)</option></select>`:''}
    </div>
    <div id="gfxPreviewWrap" style="background:#0c2233;border-radius:var(--radius-l);padding:16px;display:flex;justify-content:center;overflow-x:auto;">
      <canvas id="gfxCanvas" style="max-width:100%;height:auto;border-radius:12px;"></canvas>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" id="gfxDownloadBtn">⬇ Download PNG</button>
      <button class="btn btn-outline btn-sm" id="gfxShareBtn">↗ Share</button>
      <button class="btn btn-ghost btn-sm" id="gfxRegenBtn">✨ Regenerate</button>
    </div>
  `;
  wireAdminGraphics();
}
async function gfxCurrentBuilder(){
  if(GFX_TAB==='player'){
    const sel = document.getElementById('gfxPlayerSel');
    const p = sel && S.players[sel.value];
    if(!p) return null;
    return {build:(withPhotos)=>buildPlayerCardGraphic(p,withPhotos), filename:'player-card-'+(p.name||'player').replace(/\s+/g,'_')+'.png'};
  }
  if(GFX_TAB==='team'){
    const sel = document.getElementById('gfxTeamSel');
    const t = sel && S.teams[sel.value];
    if(!t) return null;
    return {build:(withPhotos)=>buildTeamBannerGraphic({id:sel.value,...t},withPhotos), filename:'team-banner-'+(t.name||'team').replace(/\s+/g,'_')+'.png'};
  }
  if(GFX_TAB==='sold'){
    const sel = document.getElementById('gfxSoldSel');
    const aspectSel = document.getElementById('gfxSoldAspect');
    const p = sel && S.players[sel.value];
    if(!p) return null;
    return {build:(withPhotos)=>buildSoldCardGraphic(p,withPhotos, aspectSel?aspectSel.value:'1:1'), filename:'sold-card-'+(p.name||'player').replace(/\s+/g,'_')+'.png'};
  }
  return null;
}
async function gfxRenderPreview(){
  const canvas = document.getElementById('gfxCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const entry = await gfxCurrentBuilder();
  if(!entry){ canvas.width=600; canvas.height=200; ctx.fillStyle='#0c2233'; ctx.fillRect(0,0,600,200); ctx.fillStyle='#93b0ac'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText('Nothing selected yet', 300, 104); return; }
  try{
    const built = await entry.build(true);
    canvas.width = built.width; canvas.height = built.height;
    ctx.drawImage(built,0,0);
  }catch(err){ console.error(err); toast('Could not render preview: '+(err.message||err),'error'); }
}
function wireAdminGraphics(){
  document.querySelectorAll('[data-gt]').forEach(el=>{
    el.onclick = ()=>{ GFX_TAB = el.dataset.gt; renderAdminGraphics(document.getElementById('adminMain')); };
  });
  ['gfxPlayerSel','gfxTeamSel','gfxSoldSel','gfxSoldAspect'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onchange = gfxRenderPreview;
  });
  const regenBtn = document.getElementById('gfxRegenBtn');
  if(regenBtn) regenBtn.onclick = gfxRenderPreview;
  const dlBtn = document.getElementById('gfxDownloadBtn');
  if(dlBtn) dlBtn.onclick = async ()=>{
    const entry = await gfxCurrentBuilder();
    if(!entry){ toast('Select something first','error'); return; }
    downloadCanvasCard(entry.build, entry.filename);
  };
  const shareBtn = document.getElementById('gfxShareBtn');
  if(shareBtn) shareBtn.onclick = async ()=>{
    const entry = await gfxCurrentBuilder();
    if(!entry){ toast('Select something first','error'); return; }
    try{
      let canvas = await entry.build(true);
      canvas.toBlob(async (blob)=>{
        if(!blob){ toast('Could not generate image','error'); return; }
        const file = new File([blob], entry.filename, {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file], title:entry.filename}).catch(()=>{});
        } else {
          downloadCanvasCard(entry.build, entry.filename);
          toast('Sharing not supported here — downloaded instead','info');
        }
      }, 'image/png');
    }catch(err){ console.error(err); toast('Could not share: '+(err.message||err),'error'); }
  };
  gfxRenderPreview();
}
function generatePlayerStatsPDF(share){
  const stats = computePlayerStats().slice().sort((a,b)=>b.runs-a.runs);
  if(!stats.length){ toast('No stats yet','error'); return; }
  const doc = new jspdf.jsPDF('l','mm','a4'); // landscape for more columns
  const s = S.settings||{};
  doc.setFillColor(10,46,31); doc.rect(0,0,297,28,'F');
  doc.setTextColor(240,212,136); doc.setFontSize(16); doc.setFont(undefined,'bold');
  doc.text(s.name || 'EPL — Eid Premier League', 14, 14);
  doc.setTextColor(255,255,255); doc.setFontSize(10); doc.setFont(undefined,'normal');
  doc.text(s.season || '', 14, 21);
  doc.setTextColor(20,30,25); doc.setFontSize(14); doc.setFont(undefined,'bold');
  doc.text('Player Statistics — Full Tournament Stats', 14, 38);
  doc.setDrawColor(215,166,59); doc.setLineWidth(1); doc.line(14,42,283,42);
  let y = 50;
  const cols = [
    {h:'Player',w:16,key:'name',align:'left'},
    {h:'Team',w:52,key:'team',align:'left'},
    {h:'M',w:70,key:'matches'},{h:'Inn',w:78,key:'innings'},
    {h:'Runs',w:87,key:'runs'},{h:'HS',w:99,key:'highScore'},
    {h:'Avg',w:110,key:'avgF'},{h:'SR',w:123,key:'srF'},
    {h:'NO',w:136,key:'notOuts'},{h:'4s',w:146,key:'fours'},{h:'6s',w:155,key:'sixes'},
    {h:'50s',w:164,key:'fifties'},{h:'100s',w:174,key:'hundreds'},
    {h:'Wkts',w:187,key:'wickets'},{h:'Econ',w:200,key:'econF'},{h:'BBI',w:212,key:'bestBowlingF'},
    {h:'Ct',w:227,key:'catches'},{h:'RO',w:236,key:'runOuts'},{h:'St',w:245,key:'stumpings'},{h:'MOM',w:255,key:'pom'}
  ];
  function drawHeaderRow(){
    doc.setFillColor(10,46,31); doc.setTextColor(255,255,255); doc.setFontSize(8); doc.setFont(undefined,'bold');
    doc.rect(14,y-4,269,6,'F');
    cols.forEach(c=> doc.text(c.h, c.w, y));
    y+=6.5;
    doc.setFont(undefined,'normal'); doc.setTextColor(20,30,25); doc.setFontSize(8);
  }
  drawHeaderRow();
  stats.forEach((row,i)=>{
    if(y>195){ doc.addPage(); y=20; drawHeaderRow(); }
    if(i%2===0){ doc.setFillColor(246,242,232); doc.rect(14,y-4,269,6,'F'); }
    const team = S.teams[row.teamId]||{};
    const vals = {
      name:row.name||'', team:team.shortName||team.name||'—',
      matches:row.matches, innings:row.innings, runs:row.runs, highScore:row.highScore,
      avgF:row.average.toFixed(1), srF:row.strikeRate.toFixed(1), notOuts:row.notOuts,
      fours:row.fours, sixes:row.sixes, fifties:row.fifties, hundreds:row.hundreds,
      wickets:row.wickets, econF:row.economy.toFixed(1), bestBowlingF:row.bestBowling||'—',
      catches:row.catches, runOuts:row.runOuts, stumpings:row.stumpings, pom:row.pom
    };
    cols.forEach(c=> doc.text(String(vals[c.key]), c.w, y));
    y+=6;
  });
  const fname = 'player-statistics-'+(s.season||'tournament').replace(/\s+/g,'_')+'.pdf';
  share ? pdfSharePrompt(doc,fname) : doc.save(fname);
}
function wireTeamDetailButtons(){
  const bBtn = document.getElementById('teamBannerBtn');
  if(bBtn) bBtn.onclick = ()=> openTeamBannerModal(bBtn.dataset.team);
  const pBtn = document.getElementById('teamPdfBtn');
  if(pBtn) pBtn.onclick = ()=>{ try{ generateTeamPDF(pBtn.dataset.team, false); }catch(err){ console.error(err); toast('Could not generate PDF: '+(err.message||err),'error'); } };
}
function wirePlayerDetailButtons(){
  const cBtn = document.getElementById('playerCardBtn');
  if(cBtn) cBtn.onclick = ()=> openPlayerCardModal(cBtn.dataset.player);
  const pBtn = document.getElementById('playerPdfBtn');
  if(pBtn) pBtn.onclick = ()=>{ try{ generatePlayerPDF(pBtn.dataset.player, false); }catch(err){ console.error(err); toast('Could not generate PDF: '+(err.message||err),'error'); } };
}
function wireMatchDetailButtons(){
  const mBtn = document.getElementById('matchPdfBtn');
  if(mBtn) mBtn.onclick = ()=>{ try{ generateMatchSummaryPDF(mBtn.dataset.match, false); }catch(err){ console.error(err); toast('Could not generate PDF: '+(err.message||err),'error'); } };
  if(document.getElementById('mfContent')){
    const {param} = parseHash();
    if(param && S.matches[param]) wireMatchFinishedView({id:param, ...S.matches[param]});
  }
}

function init(){
  try{
    initListeners();
    render();
  }catch(err){
    console.error(err);
    showErrorBanner((err&&err.stack) || (err&&err.message) || String(err));
  }
}
init();

/* ============================================================
   UPDATE CHECKER — detects when a newer version of this page has
   been deployed (GitHub Pages / Netlify serve this single file
   with browser-level caching we can't fully control via headers
   alone) and shows a small "tap to refresh" banner instead of
   silently leaving visitors stuck on a stale cached copy.
   ============================================================ */
(function(){
  const CURRENT_BUILD = document.querySelector('meta[name="app-build"]')?.getAttribute('content') || '';
  function checkForUpdate(){
    try{
      const url = location.pathname + location.search + (location.search? '&':'?') + '_cb=' + Date.now();
      fetch(url, {cache:'no-store'}).then(r=>r.text()).then(html=>{
        const m = html.match(/<meta\s+name=["']app-build["']\s+content=["']([^"']+)["']/i);
        const latestBuild = m ? m[1] : '';
        if(latestBuild && CURRENT_BUILD && latestBuild!==CURRENT_BUILD && !document.getElementById('updateBanner')){
          const bar = document.createElement('div');
          bar.id = 'updateBanner';
          bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:200;background:#0a2e1f;color:#f0d488;padding:12px 16px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 -2px 10px rgba(0,0,0,.3);';
          bar.textContent = '🔄 A newer version of this app is available — tap here to refresh';
          bar.onclick = ()=> location.reload(true);
          document.body.appendChild(bar);
        }
      }).catch(()=>{}); // silent — this is a best-effort background check, never blocks the app
    }catch(e){}
  }
  // Check shortly after load, then periodically, and whenever the tab regains focus
  // (e.g. an admin switching back after the tournament owner pushed an update).
  setTimeout(checkForUpdate, 4000);
  setInterval(checkForUpdate, 3*60*1000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkForUpdate(); });
})();
</script>
